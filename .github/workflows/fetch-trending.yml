name: fetch-trending

# 每 30 分钟抓一次各公链热门池（GeckoTerminal 公开 API），写入 data 分支的 data/trending.json
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-trending
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: out

      - name: Checkout main branch (for the script)
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Fetch trending pools
        working-directory: out
        run: node ../repo/scripts/fetch-trending.mjs

      - name: Commit and push
        working-directory: out
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(trending): $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
