name: fetch-weibo

# 每 5 分钟抓一次微博热搜，计算「新进榜 / 排名跃升」，写入 data 分支的 data/weibo.json
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-weibo
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: out

      - name: Checkout main branch (for the script)
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Fetch weibo hot
        working-directory: out
        run: node ../repo/scripts/fetch-weibo.mjs

      - name: Commit and push
        working-directory: out
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weibo.json
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(weibo): $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin data || true
          if ! git push origin HEAD:data; then
            echo "push retry after rebase"
            git pull --rebase origin data
            git push origin HEAD:data
          fi
