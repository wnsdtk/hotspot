<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手机热点监控</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --border:#262d36;
  --text:#e6edf3; --muted:#8b949e; --accent:#1f6feb;
  --green:#00C805; --red:#e5484d; --yellow:#F0B90B; --purple:#A371FF; --orange:#f0883e; --blue:#58a6ff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5; max-width:560px; margin-left:auto; margin-right:auto;
  padding-bottom:40px;}
a{color:var(--blue); text-decoration:none;}
.muted{color:var(--muted);} .small{font-size:12px;} .spacer{flex:1;}
.empty{color:var(--muted); text-align:center; padding:18px 8px; font-size:13px;}
/* top bar */
.topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px;
  padding:10px 12px; background:#0d1117f2; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.brand{font-size:17px; font-weight:700;}
.xbtn{background:var(--red); color:#fff; font-size:12px; padding:4px 10px; border-radius:14px;
  font-weight:600; white-space:nowrap;}
.upd{font-size:12px; color:var(--muted); white-space:nowrap;}
.iconbtn{background:var(--card2); color:var(--text); border:1px solid var(--border);
  border-radius:8px; font-size:16px; width:32px; height:30px; cursor:pointer;}
/* tabs */
.tabs{position:sticky; top:51px; z-index:49; display:flex; background:#0d1117f2;
  border-bottom:1px solid var(--border);}
.tabs button{flex:1; background:none; border:none; color:var(--muted); font-size:14px;
  padding:11px 0; cursor:pointer; border-bottom:2px solid transparent;}
.tabs button.active{color:var(--text); font-weight:700; border-bottom-color:var(--red);}
.tabpane[hidden]{display:none !important;}
/* cards & sections */
.card{background:var(--card); border:1px solid var(--border); border-radius:10px;
  margin:10px 10px; padding:12px;}
.sect{font-size:15px; font-weight:700; margin-bottom:10px;}
.sect.tog{cursor:pointer; display:flex; align-items:center; gap:6px;}
.chev{color:var(--muted); font-size:12px; margin-left:auto;}
.subhead{font-size:13px; font-weight:700; color:var(--muted); margin:12px 0 6px;}
/* mini latest cards */
.minirow{display:flex; gap:8px; margin-bottom:10px;}
.mini{flex:1; min-width:0; background:var(--card2); border:1px solid var(--border);
  border-radius:8px; padding:8px; cursor:pointer;}
.mini-name{font-size:13px; font-weight:700; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mini-text{font-size:12px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3;
  -webkit-box-orient:vertical; overflow:hidden;}
/* chips */
.chips{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
.chip{background:var(--card2); color:var(--muted); border:1px solid var(--border);
  border-radius:14px; padding:4px 12px; font-size:12px; cursor:pointer;}
.chip.on{background:var(--red); border-color:var(--red); color:#fff; font-weight:700;}
/* tweet cards */
.tweet{background:var(--card2); border:1px solid var(--border); border-radius:8px;
  padding:10px; margin-bottom:10px; cursor:pointer;}
.thead{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.avatar{width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none;}
.tname{font-weight:700; font-size:13px;} .thandle{font-size:12px;}
.tbody{font-size:13px;}
.kbadge{display:inline-block; font-size:11px; padding:1px 7px; border-radius:9px; margin-right:6px;
  background:#2d333b; color:var(--blue); border:1px solid var(--border); vertical-align:1px;}
.ttext{word-break:break-word;}
.zh{margin-top:8px; padding:8px; background:#0d1117; border-left:3px solid var(--accent);
  border-radius:4px; font-size:13px; color:#c9d4de;}
.zhtag{display:inline-block; background:var(--accent); color:#fff; font-size:10px; border-radius:4px;
  padding:0 5px; margin-right:6px;}
.tmedia{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;}
.timg{max-width:100%; max-height:220px; border-radius:8px; border:1px solid var(--border);}
.tlink{margin-top:8px; font-size:12px; color:var(--blue);}
/* hot rows */
.hrow{display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--border);
  cursor:pointer;}
.hrow:last-child{border-bottom:none;}
.idx{color:#9aa4b2; font-size:12px; width:20px; flex:none; text-align:center;}
.word{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px;}
.hotv{color:#c9d1d9; font-size:12px; flex:none; font-weight:600;}
.badge{font-size:11px; padding:1px 7px; border-radius:9px; flex:none; white-space:nowrap;}
.badge.green{background:#0f2c1a; color:var(--green); border:1px solid #1c5c33;}
.badge.red{background:#3a1414; color:#ff7b72; border:1px solid #7a2d2d;}
.badge.orange{background:#3a2410; color:var(--orange); border:1px solid #7a4d1f;}
.badge.blue{background:#0f2743; color:var(--blue); border:1px solid #1f4d7a;}
.badge.gray{background:#2d333b; color:var(--muted); border:1px solid var(--border);}
.badge.hot{background:#3a1414; color:#ff4d4f; border:1px solid #a02d2d; font-weight:700;}
.badge.new{background:#0f2743; color:#58a6ff; border:1px solid #1f4d7a; font-weight:700;}
/* v9: person tint backgrounds for tweet cards */
.tweet.pt-heyi{background:rgba(255,107,129,.07); border-color:rgba(255,107,129,.25);}
.lcard.pt-heyi{background:rgba(255,107,129,.06); border-color:rgba(255,107,129,.22);}
.lcard.pt-cz{background:rgba(240,185,11,.06); border-color:rgba(240,185,11,.22);}
.lcard.pt-elon{background:rgba(88,166,255,.06); border-color:rgba(88,166,255,.22);}
.histitem.pt-heyi{background:rgba(255,107,129,.05); border-radius:6px; padding:8px; margin-bottom:6px;}
.histitem.pt-cz{background:rgba(240,185,11,.05); border-radius:6px; padding:8px; margin-bottom:6px;}
.histitem.pt-elon{background:rgba(88,166,255,.05); border-radius:6px; padding:8px; margin-bottom:6px;}
.tweet.pt-cz{background:rgba(240,185,11,.07); border-color:rgba(240,185,11,.25);}
.tweet.pt-elon{background:rgba(88,166,255,.07); border-color:rgba(88,166,255,.25);}
.ccard.pt-heyi{background:rgba(255,107,129,.08); border-color:rgba(255,107,129,.3);}
.ccard.pt-cz{background:rgba(240,185,11,.08); border-color:rgba(240,185,11,.3);}
.ccard.pt-elon{background:rgba(88,166,255,.08); border-color:rgba(88,166,255,.3);}
.dsec.pt-heyi{border-left:3px solid #ff6b81;}
.dsec.pt-cz{border-left:3px solid #F0B90B;}
.dsec.pt-elon{border-left:3px solid #58a6ff;}
.badge.ynarr{background:#2c250e; color:var(--yellow); border:1px solid #6b5a17;}
.smart.pu{background:#241a3a; color:var(--purple); border-color:#4a3670;}
.hrow .idx.top3{color:#ff4d4f; font-weight:800; text-shadow:0 0 8px rgba(255,77,79,.4);}
/* latest-one cards */
.lcard{background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer;}
.lhead{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.lavatar{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none;}
.lname{font-weight:700; font-size:14px;}
.lbody{font-size:13px; word-break:break-word; color:var(--text);}
.lsub{font-size:12px; color:var(--muted); margin-bottom:8px;}
.go{color:var(--muted); flex:none;}
.morebtn{display:block; width:100%; margin-top:8px; background:var(--card2); color:var(--blue);
  border:1px solid var(--border); border-radius:8px; padding:8px; font-size:13px; cursor:pointer;}
/* liquidity */
.chain{border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--card2);}
.chainrow{display:flex; align-items:center; gap:8px; padding:10px; cursor:pointer;}
.chainname{font-weight:700;} .chev{margin-left:8px;}
.metrics{padding:0 10px 10px;}
.mrow{display:flex; justify-content:space-between; padding:5px 0; font-size:13px;
  border-top:1px dashed var(--border);}
/* liquidity rich */
.pos{color:var(--green);} .neg{color:var(--red);}
.up{color:var(--green);} .dn{color:var(--red);}
.liqtitle{display:flex;align-items:center;gap:8px;padding:10px 10px 6px;font-weight:700;font-size:14px;}
.tfbadge{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:2px 6px;}
.netflow{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap;}
.tokrow{display:flex;gap:8px;padding:4px 10px 8px;}
.tok{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;min-width:0;}
.tok .tname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tok .tprice{font-size:14px;font-weight:700;margin-top:4px;}
.tok .tmeta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6;}
.bsbar{padding:0 10px 4px;}
.bsbar .bar{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--card);}
.bsbar .buy{background:var(--green);} .bsbar .sell{background:var(--red);}
.bsbar .mid{text-align:center;font-size:12px;font-weight:700;margin:6px 0 2px;}
.bsbar .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 10px 12px;}
.mcell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;min-width:0;}
.mcell .mk{font-size:11px;color:var(--muted);}
.mcell .mv{font-size:14px;font-weight:700;margin-top:4px;}
.mcell .mv .up,.mcell .mv .dn{font-size:11px;font-weight:400;}
/* tags */
.tagrow{padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px;}
.tagrow:last-child{border-bottom:none;}
.tagrow.link{cursor:pointer; display:flex; align-items:center; gap:8px;}
.tagtext{flex:1;} .coinsym{color:var(--yellow); font-size:12px; font-weight:700;}
/* coin cards */
.coinlist{border-radius:8px; padding:8px;}
.coin{background:var(--card2); border:1px solid var(--border); border-radius:8px;
  padding:10px; margin-bottom:8px;}
.chead{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.icon{width:28px; height:28px; border-radius:50%; background:#2d333b; flex:none;
  display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:12px; color:var(--muted);}
.icon img{width:100%; height:100%; object-fit:cover;}
.cname{font-weight:700; font-size:14px; cursor:pointer; color:var(--text);}
.smart{margin-left:auto; font-size:11px; color:var(--yellow); border:1px solid #6b5a17;
  background:#2c250e; padding:1px 8px; border-radius:9px; white-space:nowrap; flex:none;}
.cinfo{font-size:12px; color:var(--muted); margin-bottom:4px;}
.cnarr{font-size:12px; color:var(--blue); margin-bottom:6px;}
.hist{font-size:12px; color:var(--orange); margin-bottom:6px;}
.btnrow{display:flex; gap:6px; flex-wrap:wrap;}
.cbtn{background:#0d1117; color:var(--text); border:1px solid var(--border); border-radius:7px;
  padding:6px 10px; font-size:12px; cursor:pointer; white-space:nowrap;}
.cbtn.ca{color:var(--blue); max-width:150px; overflow:hidden; text-overflow:ellipsis;}
.cbtn:active{background:#2d333b;}
.src{font-weight:400;}
/* summary */
.countcards{display:flex; gap:8px; margin-bottom:4px;}
.ccard{flex:1; min-width:0; background:var(--card2); border:1px solid var(--border);
  border-radius:8px; padding:10px 8px; cursor:pointer; text-align:center;}
.ccard.open{border-color:var(--red);}
.cface-name{font-weight:700; font-size:14px; margin-bottom:4px;}
.cface-total{font-size:12px; color:var(--muted); margin-bottom:6px;}
.cbreak{display:flex; flex-wrap:wrap; gap:3px 6px; justify-content:center; font-size:10px; color:var(--muted);}
.chist{margin-top:6px; text-align:left; border-top:1px solid var(--border); padding-top:8px;}
.histitem{padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px;}
.histitem:last-child{border-bottom:none;}
.htime{color:var(--muted); font-size:11px; margin-right:6px;}
.datehead{font-size:14px; font-weight:700; margin-bottom:10px;}
.dayrow{display:flex; align-items:center; padding:9px 4px; border-bottom:1px solid var(--border);
  cursor:pointer; font-size:13px;}
.daytags{padding:4px 4px 8px;}
.binitem{padding:10px 4px; border-bottom:1px solid var(--border); cursor:pointer;}
.binitem:last-child{border-bottom:none;}
.btype{font-size:11px; padding:1px 8px; border-radius:9px; margin-right:8px; white-space:nowrap;}
.btype.listing{background:#0f2c1a; color:var(--green); border:1px solid #1c5c33;}
.btype.delisting{background:#3a1414; color:#ff7b72; border:1px solid #7a2d2d;}
.btype.alpha{background:#2c250e; color:var(--yellow); border:1px solid #6b5a17;}
.btitle{font-size:13px; font-weight:600;}
.ben{font-size:12px; color:var(--muted); margin-top:2px;}
.btime{font-size:11px; color:var(--muted); margin-top:4px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">热点监控</div>
  <a id="xbtn-heyi" class="xbtn" target="_blank" rel="noopener">@何一</a>
  <a id="xbtn-zb" class="xbtn" target="_blank" rel="noopener">@赵长鹏</a>
  <div class="spacer"></div>
  <div class="upd">更新于 <span id="upd-time">—</span></div>
  <button class="iconbtn" data-act="refresh" title="刷新">⟳</button>
</header>
<nav class="tabs">
  <button data-act="tab" data-tab="all" class="active">全部</button>
  <button data-act="tab" data-tab="hot">热搜</button>
  <button data-act="tab" data-tab="trench">战壕</button>
  <button data-act="tab" data-tab="summary">📝 当日总结</button>
</nav>
<main>
  <section id="tab-all" class="tabpane"></section>
  <section id="tab-hot" class="tabpane" hidden></section>
  <section id="tab-trench" class="tabpane" hidden></section>
  <section id="tab-summary" class="tabpane" hidden></section>
</main>
<script>
'use strict';
/* ============ constants ============ */
var PEOPLE=[
  {key:'heyi', name:'何一', color:'#ff6b81'},
  {key:'cz',   name:'赵长鹏', color:'#F0B90B'},
  {key:'elon', name:'马斯克', color:'#58a6ff'}
];
var KIND_NAME={original:'原创', retweet:'转推', quote:'引用', reply:'回复', follow:'新增关注', unfollow:'取关'};
var DEBOT_SLUG={sol:'solana', bsc:'bsc', robinhood:'robinhood'};
var CHAIN_ORDER=['BSC','Solana','Robinhood','OKX','Base','Arc','Ethereum'];
var CHAIN_COLOR={BSC:'#F0B90B', Solana:'#A371FF', Robinhood:'#00C805'};
var DY_LABEL={1:'新',3:'热',5:'首发',8:'独家',9:'挑战',16:'辟谣'};
var BIN_TYPE={listing:'上市', delisting:'下架', alpha:'Alpha'};
var LIQ_LABEL={volume:'交易量',buy_volume:'买入量',sell_volume:'卖出量',wallet_count:'钱包数',token_count:'代币数',token_created_count:'新建代币',token_migrated_count:'迁移代币',tx_count:'交易笔数',volume_change_pct:'量变幅(%)',avg_buy_per_wallet:'户均买入'};
var XXAPI_WB='https://v2.xxapi.cn/api/weibohot';
var XXAPI_DY='https://v2.xxapi.cn/api/douyinhot';
/* Data lives on the "data" branch; raw.githubusercontent.com serves it
   immediately after push (no Pages rebuild wait) with CORS *. */
var DATA_BASE='https://raw.githubusercontent.com/wnsdtk/hotspot/data/data/';
var WORKER='https://snowy-mud-3037.rj982946925.workers.dev';
var WORKER_POLL_MS=10000; // 10 seconds for tweets/trench
var DATA_FILES=[
  ['tweets','tweets.json'],['bsc','trench-bsc.json'],['sol','trench-sol.json'],
  ['rb','trench-rb.json'],['consensus','consensus.json'],['liquidity','liquidity.json'],
  ['douyin','douyin.json'],['tags','tags-halfhour.json'],['daily','summary-daily.json'],
  ['binance','binance.json']
];
function dataUrl(f){return DATA_BASE+f+'?t='+Date.now();}
var POLL_MS=15000;
/* ============ state ============ */
var S={data:{}, wb:null, dy:null, prevHotlist:null, hotlistRows:null, douyinOk:false};
var UI={tab:'all', filter:'all', expanded:{}, liqChains:{}, dyN:10, wbN:10, dailyPerson:null, days:{}};
/* ============ helpers ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nl2br(s){return s.replace(/\n/g,'<br>');}
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s;}
function trim1(x){return String(Math.round(x*10)/10);}
function fmtMoney(v){
  if(v==null||v===''||isNaN(Number(v))) return '—';
  var n=Number(v), an=Math.abs(n), sign=n<0?'-':'';
  if(an>=10000) return sign+'$'+trim1(an/10000)+'万';
  if(an>=1000) return sign+'$'+Math.round(an).toLocaleString('en-US');
  return sign+'$'+Math.round(an);
}
function fmtHot(v){var n=Number(v);if(isNaN(n))return '';if(n>=10000)return trim1(n/10000)+'万';return String(Math.round(n));}
function fmtVal(v){
  if(typeof v==='number'){var an=Math.abs(v);return an>=10000?fmtMoney(v):v.toLocaleString('en-US');}
  return esc(v);
}
function relTime(iso){
  var t=Date.parse(iso);if(isNaN(t))return '';
  var s=Math.max(0,Math.floor((Date.now()-t)/1000));
  if(s<60)return '刚刚';
  var m=Math.floor(s/60);if(m<60)return m+'分钟前';
  var h=Math.floor(m/60);if(h<24)return h+'小时前';
  return Math.floor(h/24)+'天前';
}
function bjDate(d){d=d instanceof Date?d:new Date(d);if(isNaN(d))return '';
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function todayBj(){return bjDate(new Date());}
function fmtBj(iso){var d=new Date(iso);if(isNaN(d))return '';
  return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d).replace(/\//g,'-');}
function yesterdayStr(){var d=new Date();d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function personByKey(k){for(var i=0;i<PEOPLE.length;i++)if(PEOPLE[i].key===k)return PEOPLE[i];return {key:k,name:k};}
function kindBadge(kind){var n=KIND_NAME[kind]||kind;return '<span class="kbadge">'+esc(n)+'</span>';}
function debotUrl(chain,ca){var slug=DEBOT_SLUG[String(chain||'').toLowerCase()]||String(chain||'').toLowerCase();return 'https://debot.ai/token/'+slug+'/'+(ca||'');}
function xSearch(q){return 'https://x.com/search?q='+encodeURIComponent(q)+'&f=top';}
function douyinSearch(w){return 'https://www.douyin.com/search/'+encodeURIComponent(w)+'?type=general';}
function weiboSearch(t){return 'https://s.weibo.com/weibo?q='+encodeURIComponent(t);}
/* ============ fetch ============ */
function fetchJson(url){
  return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .catch(function(){return null;});
}
function freshestStamp(){
  var best=null,bt=0;
  DATA_FILES.forEach(function(j){
    var d=S.data[j[0]];if(!d)return;
    ['updated_at','generated_at'].forEach(function(k){
      if(d[k]){var t=Date.parse(d[k]);if(!isNaN(t)&&t>bt){bt=t;best=d[k];}}
    });
  });
  return best;
}
/* ============ 全部：聪明钱异动 (NEW) ============ */
function htmlSmartMoves(){
  var allToks=[];
  var nowMs=Date.now();
  ['bsc','sol','rb'].forEach(function(k){
    var d=S.data[k];
    if(d&&Array.isArray(d.tokens))d.tokens.forEach(function(t){
      var sc=Number(t.smart_count)||0;
      var vol=Number(t.vol_1h)||0;
      var cts=Number(t.creation_timestamp)||0;
      if(cts>0&&(nowMs-cts*1000)>10*86400*1000)return; // FIX v11: exclude >10 days
      if(sc>=3&&vol>0)allToks.push(t);
    });
  });
  if(!allToks.length)return '';
  // Sort by smart_count desc, take top 5

function diffHotlist(prev,curr){
  var pm={};prev.forEach(function(t){pm[t.word]=Number(t.hot_value)||0;});
  var fresh=[],cand=[];
  curr.forEach(function(t){
    if(!(t.word in pm))fresh.push(t);
    else{var g=(Number(t.hot_value)||0)-pm[t.word];if(g>0)cand.push({t:t,g:g});}
  });
  cand.sort(function(a,b){return b.g-a.g;});
  var rows=[];
  fresh.slice(0,10).forEach(function(t){rows.push({t:t,badge:'new'});});
  cand.slice(0,5).forEach(function(x){
    var dup=rows.some(function(r){return r.t.word===x.t.word;});
    if(!dup)rows.push({t:x.t,badge:'hot'});
  });
  return rows;
}

function buildLocalTags(){

  });
  if(!allToks.length)return tags;
  // Group by narrative
  var byNarr={};
  allToks.forEach(function(t){
    var n=t.narrative||'';
    if(n){if(!byNarr[n])byNarr[n]=[];byNarr[n].push(t);}
  });
  Object.keys(byNarr).forEach(function(n){
    if(byNarr[n].length>=2){
      var top=byNarr[n].sort(function(a,b){return (b.smart_count||0)-(a.smart_count||0);})[0];
      tags.push({text:'#'+n+'持续发酵', coin_symbol:'$'+(top.symbol||''), coin_ca:top.ca, coin_chain:top.chain});

  // New coin surge
  var newCoins=allToks.filter(function(t){
    var cts=Number(t.creation_timestamp)||0;
    return cts>0&&(Date.now()-cts*1000)<2*3600*1000;
  });
  if(newCoins.length>=3)tags.push({text:'#新币发行加速'});
  // BSC density
  var bscNew=allToks.filter(function(t){
    var cts=Number(t.creation_timestamp)||0;
    return t._chain==='bsc'&&cts>0&&(Date.now()-cts*1000)<2*3600*1000;
  });
  if(bscNew.length>=2)tags.push({text:'#BSC链新币最密集'});
  // Smart money pile
  var smartPile=allToks.filter(function(t){return (Number(t.smart_count)||0)>=10;});
  if(smartPile.length>=2){
    var tp=smartPile.sort(function(a,b){return (b.smart_count||0)-(a.smart_count||0);})[0];
    tags.push({text:'#聪明钱扎堆', coin_symbol:'$'+(tp.symbol||''), coin_ca:tp.ca, coin_chain:tp.chain});
  }
  // FIX v11: ensure at least 5 tags with fallbacks
  var fallbacks=['#市场情绪回暖','#链上活跃度上升','#新资金入场','#Meme季持续','#聪明钱调仓','#BSC生态活跃','#Solana新币不断'];
  var seen2={};tags.forEach(function(t){seen2[t.text]=1;});
  for(var fi=0;fi<fallbacks.length&&tags.length<5;fi++){
    if(!seen2[fallbacks[fi]]){seen2[fallbacks[fi]]=1;tags.push({text:fallbacks[fi]});}
  }
  // If still <5, add chain activity tags
  var chainNames={bsc:'BSC',sol:'Solana',rb:'Robinhood'};
  ['bsc','sol','rb'].forEach(function(k){
    if(tags.length>=5)return;
    var d=S.data[k];
    var n=(d&&Array.isArray(d.tokens))?d.tokens.length:0;
    if(n>0){
      var txt='#'+(chainNames[k]||k)+'战壕'+n+'个标的';
      if(!seen2[txt]){seen2[txt]=1;tags.push({text:txt});}
    }
  });
  return tags.slice(0,8);
}

    var ageOk=cts>0&&(now-cts*1000)<2*86400*1000;
    return mc>0&&mc<=30000&&ath>mc*3&&ageOk;
  }).sort(function(a,b){return (Number(b.smart_count)||0)-(Number(a.smart_count)||0);}).slice(0,3);
  // Group 2: high hotness within 5 days (any MC)
  var fallenIds={};fallen.forEach(function(t){fallenIds[t.ca||t.address]=1;});
  var hot=qualified.filter(function(t){
    var cts=Number(t.creation_timestamp)||0;
    var ageOk=cts>0&&(now-cts*1000)<5*86400*1000;
    return ageOk&&!fallenIds[t.ca||t.address];
  }).sort(function(a,b){
    var sa=(Number(b.smart_count)||0)-(Number(a.smart_count)||0);
    if(sa!==0)return sa;
    return (Number(b.vol_1h)||0)-(Number(a.vol_1h)||0);
  }).slice(0,2);
  // FIX v11: lenient fallback - fill up to 3+2 from qualified if strict filters too narrow
  if(fallen.length<3||hot.length<2){
    var used={};fallen.forEach(function(t){used[t.ca||t.address]=1;});hot.forEach(function(t){used[t.ca||t.address]=1;});
    var rest=qualified.filter(function(t){return !used[t.ca||t.address];})
      .sort(function(a,b){return (Number(b.smart_count)||0)-(Number(a.smart_count)||0);});
    while(fallen.length<3&&rest.length){fallen.push(rest.shift());}
    // re-mark used after filling fallen
    used={};fallen.forEach(function(t){used[t.ca||t.address]=1;});hot.forEach(function(t){used[t.ca||t.address]=1;});
    rest=qualified.filter(function(t){return !used[t.ca||t.address];})
      .sort(function(a,b){return (Number(b.smart_count)||0)-(Number(a.smart_count)||0);});
    while(hot.length<2&&rest.length){hot.push(rest.shift());}
  }
  return {fallen:fallen, hot:hot};
}

/* ============ surgical section updates ============
   Each section has a stable container id. On every poll we compute a
   signature from the section's data slice + relevant UI state (timestamps
   excluded). Only sections whose signature changed get their innerHTML
   replaced — never a full-page rewrite. Scroll position is preserved and
   expanded/collapsed states survive because they live in UI, not in DOM. */
function sigData(d){
  if(!d||typeof d!=='object')return String(d);
  var c={};
  for(var k in d)if(Object.prototype.hasOwnProperty.call(d,k)&&k!=='updated_at'&&k!=='generated_at')c[k]=d[k];
  return JSON.stringify(c);
}

function workerUrl(u){return WORKER+'/?u='+encodeURIComponent(u);}
function parseWorkerTweets(html, channel, defaultPerson){
  var tweets=[];
  try{
    var doc=new DOMParser().parseFromString(html,'text/html');
    var msgs=doc.querySelectorAll('div.tgme_widget_message_wrap');
    msgs.forEach(function(msg){
      try{
        var t=msg.querySelector('div.tgme_widget_message_text');
        if(!t)return;
        var text=t.innerText||t.textContent||'';
        var lines=text.split('\n').map(function(s){return s.trim();}).filter(function(s){return s;});
        if(lines.length<3)return;
        // time from <time datetime="">
        var timeEl=msg.querySelector('time[datetime]');
        var time=timeEl?timeEl.getAttribute('datetime'):'';
        // kind detection (simplified)
        var kind='original';
        var txt=text.toLowerCase();
        if(txt.indexOf('关注了')>=0||txt.indexOf('followed')>=0||txt.indexOf('开始关注')>=0)kind='follow';
        else if(txt.indexOf('取关')>=0||txt.indexOf('unfollowed')>=0)kind='unfollow';
        else if(txt.indexOf('转推')>=0||txt.indexOf('retweet')>=0)kind='retweet';
        else if(txt.indexOf('引用')>=0||txt.indexOf('quote')>=0)kind='quote';
        else if(txt.indexOf('回复')>=0||txt.indexOf('reply')>=0)kind='reply';
        // url from 查看原文 link
        var url='';
        var links=t.querySelectorAll('a');
        for(var i=0;i<links.length;i++){
          var a=links[i], href=a.getAttribute('href')||'';
          if(href.indexOf('/status/')>=0){url=href;break;}
        }
        var idMatch=url.match(/\/status\/(\d+)/);
        var id=idMatch?idMatch[1]:'tg_'+channel+'_'+time.replace(/[^0-9]/g,'').slice(0,14);
        // person: split heyi/cz by content (TechMelonCzHeyi has both)
        var person=defaultPerson;
        if(channel==='TechMelonCzHeyi'){
          var low=text.toLowerCase();
          if(low.indexOf('@heyibinance')>=0||text.indexOf('何一')>=0||low.indexOf('yi he')>=0){
            person='heyi';
          }else if(low.indexOf('@cz_binance')>=0||text.indexOf('赵长鹏')>=0||/^cz\b/.test(low)){
            person='cz';
          }
          // default to heyi if unclear (channel is primarily heyi)
        }
        var handle=person==='heyi'?'@heyibinance':(person==='cz'?'@cz_binance':'@elonmusk');
        // Clean text: take first meaningful lines, skip headers
        var cleanLines=lines.filter(function(l){
          return l!=='中文翻译 ——'&&l!=='💬'&&l!=='🌐'&&l!=='🕒'&&!l.startsWith('推文时间:')&&l.length>1;
        });
        var mainText=cleanLines.slice(0,8).join('\n').slice(0,500);
        if(!mainText)return;
        // FIX v11: extract images/videos from message
        var media=[];
        try{
          msg.querySelectorAll('img').forEach(function(img){
            var src=img.getAttribute('src')||'';
            if(src.indexOf('telesco.pe')>=0&&media.length<4)media.push({url:src,type:'img'});
          });
          msg.querySelectorAll('video').forEach(function(v){
            var poster=v.getAttribute('poster')||'';
            if(poster&&media.length<4)media.push({url:poster,type:'img'});
            var vsrc=v.querySelector('source');
            if(vsrc&&vsrc.getAttribute('src')&&media.length<4)media.push({url:vsrc.getAttribute('src'),type:'video'});
          });
        }catch(me){}
        tweets.push({
          id:id, person:person, handle:handle,
          time:time, text:mainText, text_zh:'',
          kind:kind, media:media, url:url
        });
      }catch(e){}
    });
  }catch(e){}
  return tweets;
}

  var channels=[

    {ch:'TechMelonElonMusk', person:'elon'}
  ];
  // heyi channel has both heyi and cz, we'll split by content later (simplified: assign by channel)
  var jobs=channels.map(function(cfg){
    return fetch(workerUrl('https://t.me/s/'+cfg.ch),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.text();})
      .then(function(html){return parseWorkerTweets(html,cfg.ch,cfg.person);})
      .catch(function(){return [];});
  });
  return Promise.all(jobs).then(function(results){
    var all=[];
    results.forEach(function(arr){all=all.concat(arr);});
    // Sort by time desc, dedupe by id
    var seen={}, uniq=[];
    all.forEach(function(t){if(!seen[t.id]){seen[t.id]=1;uniq.push(t);}});
    uniq.sort(function(a,b){return (b.time||'').localeCompare(a.time||'');});
    return {updated_at:new Date().toISOString(), tweets:uniq.slice(0,60)};
  });
}
function guessNarrative(symbol,name){
  var s=((symbol||'')+' '+(name||'')).toLowerCase();
  if(/doge|shib|pepe|wif|bonk|floki|meme/.test(s))return 'Meme币';
  if(/pepe|frog/.test(s))return '动物Meme';
  if(/dog|cat|bear|bull|pig|mouse/.test(s))return '动物Meme';
  if(/ai|gpt|agent|bot/.test(s))return 'AI概念';
  if(/gta|game|play/.test(s))return '游戏概念';
  if(/trump|musk|elon|cz|heyi/.test(s))return '人物币';
  if(/usd|usdt|usdc/.test(s))return '稳定币';
  if(/binance|bnb|okx|coinbase/.test(s))return '平台币';
  return '';
}
function normGmgnToken(t,chain){
  var mc=Number(t.market_cap)||0;
  var ath=Number(t.history_highest_market_cap)||0;
  var cts=Number(t.creation_timestamp)||0;
  var ageTx='';
  if(cts>0){
    var mins=Math.floor((Date.now()-cts*1000)/60000);
    if(mins<60)ageTx=mins+'分钟前上线';
    else if(mins<1440)ageTx=Math.floor(mins/60)+'小时前上线';
    else ageTx=Math.floor(mins/1440)+'天前上线';
  }
  return {
    address:t.address||'', symbol:t.symbol||'', name:t.name||'',
    icon:t.logo||'', chain:chain,
    market_cap:mc, history_highest_mcap:ath,
    liquidity:Number(t.liquidity)||0,
    vol_1h:Number(t.volume)||0,
    smart_count:Number(t.smart_degen_count)||0,
    smart_label:'聪明钱',
    age_text:ageTx, creation_timestamp:cts,
    twitter:t.twitter_username||'', website:t.website||'',
    narrative:guessNarrative(t.symbol,t.name),
    ca:t.address||'', x_url:t.twitter_username?('https://x.com/'+t.twitter_username):''
  };
}
function normDebotToken(t,chain){
  var mi=t.market_info||{}, psi=t.pair_summary_info||{}, si=t.social_info||{};
  return {
    address:t.address||'', symbol:t.symbol||'', name:t.name||'',
    icon:t.logo||'', chain:t.chain||chain,
    market_cap:Number(mi.mkt_cap)||0,
    liquidity:Number(psi.liquidity)||0,
    vol_1h:Number(mi.volume)||0,
    smart_count:Number(t.kol_count)||0,
    smart_label:'KOL',
    age_text:(function(){var cts=Number(t.creation_timestamp)||0;if(cts<=0)return '';var mins=Math.floor((Date.now()-cts*1000)/60000);if(mins<60)return mins+'分钟前';if(mins<1440)return Math.floor(mins/60)+'小时前';return Math.floor(mins/1440)+'天前';})(), creation_timestamp:Number(t.creation_timestamp)||0,
    twitter:si.dx_twitter||'', website:t.website||'',
    narrative:guessNarrative(t.symbol,t.name),
    ca:t.address||''
  };
}
function fetchWorkerTrench(chain){
  var gmap={bsc:'bsc', sol:'sol', rb:'robinhood'};
  var dmap={bsc:'bsc', sol:'solana', rb:'robinhood'};
  var gurl='https://gmgn.ai/defi/quotation/v1/rank/'+(gmap[chain]||chain)+'/swaps/1h';
  var durl='https://debot.ai/api/dashboard/chain/recommend/hot_token?chain='+(dmap[chain]||chain);
  // Try gmgn first, fallback to debot
  return fetch(workerUrl(gurl),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('gmgn http '+r.status);return r.json();})
    .then(function(d){
      var rank=(d&&d.data&&d.data.rank)||[];
      if(!rank.length)throw new Error('gmgn empty');
      var tokens=rank.map(function(t){return normGmgnToken(t,chain);});
      return {updated_at:new Date().toISOString(), tokens:tokens.slice(0,10), source:'gmgn'};
    })
    .catch(function(){
      return fetch(workerUrl(durl),{cache:'no-store'})
        .then(function(r){if(!r.ok)throw new Error('debot http '+r.status);return r.json();})
        .then(function(d){
          var arr=(d&&d.data)||[];
          var tokens=arr.map(function(t){return normDebotToken(t,chain);});
          return {updated_at:new Date().toISOString(), tokens:tokens.slice(0,10), source:'debot'};
        })
        .catch(function(){return null;});
    });
}
function pollWorkerFast(){
  // Tweets every 10s
  fetchWorkerTweets().then(function(d){
    if(d&&d.tweets&&d.tweets.length){
      S.data.tweets=d;
      updateSections();
      setUpdTime();
    }
  });
  // Trench every 10s (stagger slightly)
  ['bsc','sol','rb'].forEach(function(k,i){
    setTimeout(function(){
      fetchWorkerTrench(k).then(function(d){
        if(d&&d.tokens){
          S.data[k]=d;
          updateSections();
        }
      });
    }, i*1500);
  });
}
function setUpdTime(){
  var el=document.getElementById('upd-time');
  if(el){
    var d=new Date();
    var s=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
    el.textContent=s;
  }
}
function fetchWorkerDouyin(){
  return fetch(workerUrl('https://www.douyin.com/aweme/v1/web/hot/search/list/'),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(d){
      var wl=(d&&d.data&&d.data.word_list)||[];
      var tl=(d&&d.data&&d.data.trending_list)||[];
      var hotlist=wl.map(function(w){
        return {word:w.word||'', hot_value:w.hot_value||0, label:w.label||0};
      });
      var trending=tl.map(function(t){
        return {word:t.word||''};
      });
      return {updated_at:new Date().toISOString(), trending:trending, hotlist:hotlist, rising:[]};
    })
    .catch(function(){return null;});
}
function fetchWorkerLiquidity(){
  return fetch(workerUrl('https://debot.ai/api/edge/launchpad/stats/latest?interval=1h'),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(d){
      if(!d||d.code!==0)throw new Error('debot code');
      var chains=[];
      var byKey={};
      ((d.data||{}).chains||[]).forEach(function(ch){
        if(ch&&ch.chain)byKey[ch.chain]=ch;
      });
      var cmap={bsc:'bsc',solana:'solana',robinhood:'robinhood',base:'base',arc:'arc',eth:'ethereum'};
      var clabel={bsc:'BSC',solana:'Solana',robinhood:'Robinhood',base:'Base',arc:'Arc',eth:'Ethereum'};
      Object.keys(cmap).forEach(function(k){
        var ch=byKey[k];if(!ch)return;
        var s=ch.summary||{}, p=ch.prev_summary||{};
        var buy=Number(s.buy_volume)||0, sell=Number(s.sell_volume)||0;
        var vol=Number(s.volume)||0, pvol=Number(p.volume)||0;
        var metrics={
          volume:vol, buy_volume:buy, sell_volume:sell,
          wallet_count:Number(s.wallet_count)||0,
          token_count:Number(s.token_count)||0,
          token_created_count:Number(s.token_created_count)||0,
          token_migrated_count:Number(s.token_migrated_count)||0,
          tx_count:Number(s.tx_count)||0
        };
        if(pvol>0)metrics.volume_change_pct=Math.round((vol-pvol)/pvol*10000)/100;
        var wc=Number(s.wallet_count)||0;
        if(wc>0)metrics.avg_buy_per_wallet=Math.round(buy/wc*100)/100;
        chains.push({
          chain:clabel[k]||k,
          net_inflow:buy-sell,
          metrics:metrics,
          top_tokens:[]
        });
      });
      return {updated_at:new Date().toISOString(), chains:chains};
    })
    .catch(function(){return null;});
}
function pollWorkerSlow(){
  // Douyin every 5 min via Worker
  fetchWorkerDouyin().then(function(d){
    if(d&&d.hotlist&&d.hotlist.length){
      S.data.douyin=d;
      S.douyinOk=true;
      try{
        var prevSnap=JSON.parse(localStorage.getItem('dy_hotlist_snap')||'null');
        if(prevSnap&&Array.isArray(prevSnap)&&prevSnap.length){
          S.hotlistRows=diffHotlist(prevSnap,d.hotlist);
        }
        localStorage.setItem('dy_hotlist_snap',JSON.stringify(d.hotlist));
      }catch(e){}
      updateSections();
    }
  });
  // Liquidity every 5 min via Worker
  fetchWorkerLiquidity().then(function(d){
    if(d&&d.chains&&d.chains.length){
      S.data.liquidity=d;
      updateSections();
    }
  });
}
/* ============ refresh / boot ============ */

function refresh(){
  var jobs=DATA_FILES.map(function(j){return fetchJson(dataUrl(j[1])).then(function(d){return [j[0],d];});});
  jobs.push(fetchJson(XXAPI_WB).then(function(d){return ['wb',d];}));
  jobs.push(fetchJson(XXAPI_DY).then(function(d){return ['dy',d];}));
  return Promise.all(jobs).then(function(results){
    var data={},wb=null,dy=null;
    results.forEach(function(r){
      if(r[0]==='wb')wb=r[1];else if(r[0]==='dy')dy=r[1];else data[r[0]]=r[1];
    });
    S.data=data;S.wb=wb;S.dy=dy;
    var dj=data.douyin;
    S.douyinOk=!!(dj&&Array.isArray(dj.hotlist));
    if(S.douyinOk){
      try{
        var prevSnap=JSON.parse(localStorage.getItem('dy_hotlist_snap')||'null');
        if(prevSnap&&Array.isArray(prevSnap))S.hotlistRows=diffHotlist(prevSnap,dj.hotlist);
        localStorage.setItem('dy_hotlist_snap',JSON.stringify(dj.hotlist));
      }catch(e){
        if(S.prevHotlist)S.hotlistRows=diffHotlist(S.prevHotlist,dj.hotlist);
      }
      S.prevHotlist=dj.hotlist;
    }
    updateSections();
  });
}
function boot(){
  var y=yesterdayStr();
  var a=document.getElementById('xbtn-heyi');
  if(a)a.href='https://x.com/search?q=%40heyibinance%20since:'+y+'&f=top';
  var b=document.getElementById('xbtn-zb');
  if(b)b.href='https://x.com/search?q=%40cz_binance%20since:'+y+'&f=top';
  buildShell();
  updateSections();
  refresh();
  setInterval(refresh,POLL_MS);
  // v9: Worker 10s polling for tweets/trench (real-time)
  setTimeout(pollWorkerFast, 3000); // first poll after 3s
  setInterval(pollWorkerFast, WORKER_POLL_MS);
  setTimeout(pollWorkerSlow, 8000);
  setInterval(pollWorkerSlow, 300000); // 5 min
  // FIX v11: generate daily summary locally at 22:00 (don't rely on GitHub Actions)
  setInterval(function(){
    try{
      var d=new Date();
      if(d.getHours()===22&&d.getMinutes()<10)generateDailySummaryLocal();
    }catch(e){}
  }, 60000);
  // Also try once on boot if past 22:00
  try{var _d=new Date();if(_d.getHours()>=22)generateDailySummaryLocal();}catch(e){}
}
