<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手机热点监控</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1c2330; --border:#262d36;
  --text:#e6edf3; --muted:#8b949e; --accent:#1f6feb;
  --green:#00C805; --red:#e5484d; --yellow:#F0B90B; --purple:#A371FF; --orange:#f0883e; --blue:#58a6ff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5; max-width:560px; margin-left:auto; margin-right:auto;
  padding-bottom:40px;}
a{color:var(--blue); text-decoration:none;}
.muted{color:var(--muted);} .small{font-size:12px;} .spacer{flex:1;}
.empty{color:var(--muted); text-align:center; padding:18px 8px; font-size:13px;}
/* top bar */
.topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:8px;
  padding:10px 12px; background:#0d1117f2; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.brand{font-size:17px; font-weight:700;}
.xbtn{background:var(--red); color:#fff; font-size:12px; padding:4px 10px; border-radius:14px;
  font-weight:600; white-space:nowrap;}
.upd{font-size:12px; color:var(--muted); white-space:nowrap;}
.iconbtn{background:var(--card2); color:var(--text); border:1px solid var(--border);
  border-radius:8px; font-size:16px; width:32px; height:30px; cursor:pointer;}
/* tabs */
.tabs{position:sticky; top:51px; z-index:49; display:flex; background:#0d1117f2;
  border-bottom:1px solid var(--border);}
.tabs button{flex:1; background:none; border:none; color:var(--muted); font-size:14px;
  padding:11px 0; cursor:pointer; border-bottom:2px solid transparent;}
.tabs button.active{color:var(--text); font-weight:700; border-bottom-color:var(--red);}
.tabpane[hidden]{display:none !important;}
/* cards & sections */
.card{background:var(--card); border:1px solid var(--border); border-radius:10px;
  margin:10px 10px; padding:12px;}
.sect{font-size:15px; font-weight:700; margin-bottom:10px;}
.sect.tog{cursor:pointer; display:flex; align-items:center; gap:6px;}
.chev{color:var(--muted); font-size:12px; margin-left:auto;}
.subhead{font-size:13px; font-weight:700; color:var(--muted); margin:12px 0 6px;}
/* mini latest cards */
.minirow{display:flex; gap:8px; margin-bottom:10px;}
.mini{flex:1; min-width:0; background:var(--card2); border:1px solid var(--border);
  border-radius:8px; padding:8px; cursor:pointer;}
.mini-name{font-size:13px; font-weight:700; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.mini-text{font-size:12px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3;
  -webkit-box-orient:vertical; overflow:hidden;}
/* chips */
.chips{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
.chip{background:var(--card2); color:var(--muted); border:1px solid var(--border);
  border-radius:14px; padding:4px 12px; font-size:12px; cursor:pointer;}
.chip.on{background:var(--red); border-color:var(--red); color:#fff; font-weight:700;}
/* tweet cards */
.tweet{background:var(--card2); border:1px solid var(--border); border-radius:8px;
  padding:10px; margin-bottom:10px; cursor:pointer;}
.thead{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.avatar{width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none;}
.tname{font-weight:700; font-size:13px;} .thandle{font-size:12px;}
.tbody{font-size:13px;}
.kbadge{display:inline-block; font-size:11px; padding:1px 7px; border-radius:9px; margin-right:6px;
  background:#2d333b; color:var(--blue); border:1px solid var(--border); vertical-align:1px;}
.ttext{word-break:break-word;}
.zh{margin-top:8px; padding:8px; background:#0d1117; border-left:3px solid var(--accent);
  border-radius:4px; font-size:13px; color:#c9d4de;}
.zhtag{display:inline-block; background:var(--accent); color:#fff; font-size:10px; border-radius:4px;
  padding:0 5px; margin-right:6px;}
.tmedia{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;}
.timg{max-width:100%; max-height:220px; border-radius:8px; border:1px solid var(--border);}
.tlink{margin-top:8px; font-size:12px; color:var(--blue);}
/* hot rows */
.hrow{display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--border);
  cursor:pointer;}
.hrow:last-child{border-bottom:none;}
.idx{color:#9aa4b2; font-size:12px; width:20px; flex:none; text-align:center;}
.word{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px;}
.hotv{color:#c9d1d9; font-size:12px; flex:none; font-weight:600;}
.badge{font-size:11px; padding:1px 7px; border-radius:9px; flex:none; white-space:nowrap;}
.badge.green{background:#0f2c1a; color:var(--green); border:1px solid #1c5c33;}
.badge.red{background:#3a1414; color:#ff7b72; border:1px solid #7a2d2d;}
.badge.orange{background:#3a2410; color:var(--orange); border:1px solid #7a4d1f;}
.badge.blue{background:#0f2743; color:var(--blue); border:1px solid #1f4d7a;}
.badge.gray{background:#2d333b; color:var(--muted); border:1px solid var(--border);}
.badge.hot{background:#3a1414; color:#ff4d4f; border:1px solid #a02d2d; font-weight:700;}
.badge.new{background:#0f2743; color:#58a6ff; border:1px solid #1f4d7a; font-weight:700;}
/* v9: person tint backgrounds for tweet cards */
.tweet.pt-heyi{background:rgba(255,107,129,.07); border-color:rgba(255,107,129,.25);}
.lcard.pt-heyi{background:rgba(255,107,129,.06); border-color:rgba(255,107,129,.22);}
.lcard.pt-cz{background:rgba(240,185,11,.06); border-color:rgba(240,185,11,.22);}
.lcard.pt-elon{background:rgba(88,166,255,.06); border-color:rgba(88,166,255,.22);}
.histitem.pt-heyi{background:rgba(255,107,129,.05); border-radius:6px; padding:8px; margin-bottom:6px;}
.histitem.pt-cz{background:rgba(240,185,11,.05); border-radius:6px; padding:8px; margin-bottom:6px;}
.histitem.pt-elon{background:rgba(88,166,255,.05); border-radius:6px; padding:8px; margin-bottom:6px;}
.tweet.pt-cz{background:rgba(240,185,11,.07); border-color:rgba(240,185,11,.25);}
.tweet.pt-elon{background:rgba(88,166,255,.07); border-color:rgba(88,166,255,.25);}
.ccard.pt-heyi{background:rgba(255,107,129,.08); border-color:rgba(255,107,129,.3);}
.ccard.pt-cz{background:rgba(240,185,11,.08); border-color:rgba(240,185,11,.3);}
.ccard.pt-elon{background:rgba(88,166,255,.08); border-color:rgba(88,166,255,.3);}
.dsec.pt-heyi{border-left:3px solid #ff6b81;}
.dsec.pt-cz{border-left:3px solid #F0B90B;}
.dsec.pt-elon{border-left:3px solid #58a6ff;}
.badge.ynarr{background:#2c250e; color:var(--yellow); border:1px solid #6b5a17;}
.smart.pu{background:#241a3a; color:var(--purple); border-color:#4a3670;}
.hrow .idx.top3{color:#ff4d4f; font-weight:800; text-shadow:0 0 8px rgba(255,77,79,.4);}
/* latest-one cards */
.lcard{background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer;}
.lhead{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.lavatar{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex:none;}
.lname{font-weight:700; font-size:14px;}
.lbody{font-size:13px; word-break:break-word; color:var(--text);}
.lsub{font-size:12px; color:var(--muted); margin-bottom:8px;}
.go{color:var(--muted); flex:none;}
.morebtn{display:block; width:100%; margin-top:8px; background:var(--card2); color:var(--blue);
  border:1px solid var(--border); border-radius:8px; padding:8px; font-size:13px; cursor:pointer;}
/* liquidity */
.chain{border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--card2);}
.chainrow{display:flex; align-items:center; gap:8px; padding:10px; cursor:pointer;}
.chainname{font-weight:700;} .chev{margin-left:8px;}
.metrics{padding:0 10px 10px;}
.mrow{display:flex; justify-content:space-between; padding:5px 0; font-size:13px;
  border-top:1px dashed var(--border);}
/* liquidity rich */
.pos{color:var(--green);} .neg{color:var(--red);}
.up{color:var(--green);} .dn{color:var(--red);}
.liqtitle{display:flex;align-items:center;gap:8px;padding:10px 10px 6px;font-weight:700;font-size:14px;}
.tfbadge{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:2px 6px;}
.netflow{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap;}
.tokrow{display:flex;gap:8px;padding:4px 10px 8px;}
.tok{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;min-width:0;}
.tok .tname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tok .tprice{font-size:14px;font-weight:700;margin-top:4px;}
.tok .tmeta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6;}
.bsbar{padding:0 10px 4px;}
.bsbar .bar{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--card);}
.bsbar .buy{background:var(--green);} .bsbar .sell{background:var(--red);}
.bsbar .mid{text-align:center;font-size:12px;font-weight:700;margin:6px 0 2px;}
.bsbar .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 10px 12px;}
.mcell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;min-width:0;}
.mcell .mk{font-size:11px;color:var(--muted);}
.mcell .mv{font-size:14px;font-weight:700;margin-top:4px;}
.mcell .mv .up,.mcell .mv .dn{font-size:11px;font-weight:400;}
/* tags */
.tagrow{padding:9px 4px; border-bottom:1px solid var(--border); font-size:13px;}
.tagrow:last-child{border-bottom:none;}
.tagrow.link{cursor:pointer; display:flex; align-items:center; gap:8px;}
.tagtext{flex:1;} .coinsym{color:var(--yellow); font-size:12px; font-weight:700;}
/* coin cards */
.coinlist{border-radius:8px; padding:8px;}
.coin{background:var(--card2); border:1px solid var(--border); border-radius:8px;
  padding:10px; margin-bottom:8px;}
.chead{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.icon{width:28px; height:28px; border-radius:50%; background:#2d333b; flex:none;
  display:flex; align-items:center; justify-content:center; overflow:hidden; font-size:12px; color:var(--muted);}
.icon img{width:100%; height:100%; object-fit:cover;}
.cname{font-weight:700; font-size:14px; cursor:pointer; color:var(--text);}
.smart{margin-left:auto; font-size:11px; color:var(--yellow); border:1px solid #6b5a17;
  background:#2c250e; padding:1px 8px; border-radius:9px; white-space:nowrap; flex:none;}
.cinfo{font-size:12px; color:var(--muted); margin-bottom:4px;}
.cnarr{font-size:12px; color:var(--blue); margin-bottom:6px;}
.hist{font-size:12px; color:var(--orange); margin-bottom:6px;}
.btnrow{display:flex; gap:6px; flex-wrap:wrap;}
.cbtn{background:#0d1117; color:var(--text); border:1px solid var(--border); border-radius:7px;
  padding:6px 10px; font-size:12px; cursor:pointer; white-space:nowrap;}
.cbtn.ca{color:var(--blue); max-width:150px; overflow:hidden; text-overflow:ellipsis;}
.cbtn:active{background:#2d333b;}
.src{font-weight:400;}
/* summary */
.countcards{display:flex; gap:8px; margin-bottom:4px;}
.ccard{flex:1; min-width:0; background:var(--card2); border:1px solid var(--border);
  border-radius:8px; padding:10px 8px; cursor:pointer; text-align:center;}
.ccard.open{border-color:var(--red);}
.cface-name{font-weight:700; font-size:14px; margin-bottom:4px;}
.cface-total{font-size:12px; color:var(--muted); margin-bottom:6px;}
.cbreak{display:flex; flex-wrap:wrap; gap:3px 6px; justify-content:center; font-size:10px; color:var(--muted);}
.chist{margin-top:6px; text-align:left; border-top:1px solid var(--border); padding-top:8px;}
.histitem{padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px;}
.histitem:last-child{border-bottom:none;}
.htime{color:var(--muted); font-size:11px; margin-right:6px;}
.datehead{font-size:14px; font-weight:700; margin-bottom:10px;}
.dayrow{display:flex; align-items:center; padding:9px 4px; border-bottom:1px solid var(--border);
  cursor:pointer; font-size:13px;}
.daytags{padding:4px 4px 8px;}
.binitem{padding:10px 4px; border-bottom:1px solid var(--border); cursor:pointer;}
.binitem:last-child{border-bottom:none;}
.btype{font-size:11px; padding:1px 8px; border-radius:9px; margin-right:8px; white-space:nowrap;}
.btype.listing{background:#0f2c1a; color:var(--green); border:1px solid #1c5c33;}
.btype.delisting{background:#3a1414; color:#ff7b72; border:1px solid #7a2d2d;}
.btype.alpha{background:#2c250e; color:var(--yellow); border:1px solid #6b5a17;}
.btitle{font-size:13px; font-weight:600;}
.ben{font-size:12px; color:var(--muted); margin-top:2px;}
.btime{font-size:11px; color:var(--muted); margin-top:4px;}
/* ===== v22 · DeBot 式流动性仪表盘 ===== */
.liq .liq-top{display:flex; align-items:center; gap:7px; margin:2px 0 10px;}
.liq .cicon{width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:800; color:#0a0d13; background:var(--c,#888); flex:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
.liq .liq-t{font-size:13.5px; font-weight:700; letter-spacing:-.01em;}
.liq .qi{width:14px; height:14px; border-radius:50%; border:1px solid var(--border-2,#2d3440); color:var(--dim,#66727f);
  font-size:9px; line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:help; flex:none;}
.liq .liq-more{margin-left:auto; font-size:11px; color:var(--muted,#8d9aac); border:1px solid var(--border-2,#2d3440);
  border-radius:7px; padding:4px 9px; white-space:nowrap; text-decoration:none;}
.liq .liq-tools{display:flex; align-items:center; gap:8px; margin-bottom:11px;}
.liq .cicorow{display:flex; gap:5px; overflow-x:auto; flex:1; min-width:0; padding:2px 0;
  scrollbar-width:none; -ms-overflow-style:none;
  -webkit-mask-image:linear-gradient(to right,#000 90%,transparent 100%);
  mask-image:linear-gradient(to right,#000 90%,transparent 100%);}
.liq .cicorow::-webkit-scrollbar{display:none;}
.liq .ci{width:24px; height:24px; flex:none; padding:0; border:none; background:none; cursor:pointer;
  border-radius:50%; transition:transform .12s ease, box-shadow .12s ease;}
.liq .ci .g{display:flex; width:100%; height:100%; border-radius:50%; align-items:center; justify-content:center;
  font-size:11px; font-weight:800; color:#0a0d13; background:var(--c,#888); opacity:.6;}
.liq .ci.on .g{opacity:1;}
.liq .ci.on{box-shadow:0 0 0 2px rgba(255,255,255,.5); transform:scale(1.04);}
.liq .segs{display:flex; flex:none; gap:2px; padding:2px; border-radius:8px;
  background:rgba(255,255,255,.05); border:1px solid var(--border,#262d36);}
.liq .segs button{border:none; background:none; color:var(--dim,#66727f); font-size:11px; font-weight:600;
  padding:4px 7px; min-width:32px; border-radius:6px; cursor:pointer; font-family:inherit;}
.liq .segs button.on{background:rgba(255,255,255,.14); color:#fff;}
.liq .lps{display:flex; gap:7px; margin-bottom:12px;}
.liq .lp{flex:1; min-width:0; background:rgba(255,255,255,.028); border:1px solid var(--border,#262d36);
  border-radius:10px; padding:8px 9px;}
.liq .lp-h{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted,#8d9aac);
  font-weight:600; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
.liq .lp-ico{width:14px; height:14px; flex:none; border-radius:5px; display:inline-flex; align-items:center;
  justify-content:center; font-size:9px; font-weight:800; color:#0a0d13; background:var(--c,#888);}
.liq .lp-v{font-size:13.5px; font-weight:700; margin-top:5px; font-family:var(--mono,monospace);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.liq .lp-p{margin-top:1px; font-size:11px;}
.liq .flow{margin-bottom:11px;}
.liq .flow-lbls{display:flex; align-items:baseline; justify-content:space-between; gap:6px;
  font-size:11px; color:var(--dim,#66727f); margin-bottom:6px;}
.liq .flow-lbls b{color:var(--muted,#8d9aac); font-weight:700; font-family:var(--mono,monospace);
  font-variant-numeric:tabular-nums;}
.liq .flow-lbls .net{font-weight:700; font-size:11.5px;}
.liq .flowbar{display:flex; height:6px; border-radius:4px; overflow:hidden; background:rgba(255,255,255,.06);}
.liq .flowbar i{display:block; height:100%;}
.liq .flowbar .buy{background:#2EBD85;}
.liq .flowbar .sell{background:#F6465D;}
.liq .pct{font-size:11px; font-weight:650; font-family:var(--mono,monospace); white-space:nowrap;}
.liq .pct.up{color:#2EBD85;}
.liq .pct.dn{color:#F6465D;}
.liq .mgrid{grid-template-columns:repeat(3,minmax(0,1fr));}
.liq .mcell{padding:8px 9px;}
.liq .mcell .mk{font-size:10px; line-height:1.3; min-height:26px; display:flex; align-items:center;}
.liq .mcell .mv{font-size:13.5px; display:flex; align-items:baseline; gap:4px; flex-wrap:wrap; letter-spacing:-.02em;}
.liq .mcell .mv .pct{font-size:10px;}
.liq .empty{padding:16px 8px;}
@media (max-width:359px){
  .liq .lp{padding:7px 6px;}
  .liq .lp-v{font-size:12.5px;}
  .liq .segs button{min-width:28px; padding:4px 5px;}
}

/* ===== v22 · 今日链上热度总结 ===== */
.dmeta{font-size:11px; color:var(--dim,#66727f); margin:-2px 0 10px; font-family:var(--mono,monospace);}
.dperiod{background:rgba(255,255,255,.025); border:1px solid var(--border,#262d36); border-radius:10px;
  padding:10px 11px; margin-bottom:8px;}
.dph{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; margin-bottom:8px;}
.dph span{font-weight:400; font-size:10.5px; color:var(--dim,#66727f); font-family:var(--mono,monospace);}
.dchips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:2px;}
.dchip{font-size:11.5px; padding:2px 9px; border-radius:20px; color:#9fb0c6;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07);}
.dcoins{margin-top:8px; display:flex; flex-direction:column; gap:4px;}
.dcoin{display:flex; align-items:center; gap:8px; font-size:12px; padding:4px 0; color:inherit;}
.dcoin b{color:#e8c65a; font-size:12.5px;}
.dcoin span{color:var(--dim,#66727f); font-size:10.5px;}
.dcoin .dhit{margin-left:auto; font-family:var(--mono,monospace);}
.dhist{display:flex; align-items:center; gap:8px; padding:7px 2px; border-bottom:1px solid var(--border,#262d36);
  font-size:11px; color:var(--muted,#8d9aac); overflow:hidden;}
.dhist:last-child{border-bottom:none;}
.dhist .dhd{font-family:var(--mono,monospace); color:var(--dim,#66727f); flex:none; width:34px;}
.dhist .dhv{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ===== v27 · 当日总结卡片 ===== */
.ccard .cdot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px;}
.ccard .cnum{font-size:24px; font-weight:800; line-height:1.05; color:#fff; margin:3px 0 7px;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.ccard .cnum span{font-size:10px; font-weight:500; color:var(--dim,#66727f); margin-left:2px; letter-spacing:0;}
.cstat-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px 2px;}
.cstat{display:flex; flex-direction:column; align-items:center; line-height:1.3; min-width:0;}
.cstat b{font-size:12.5px; font-weight:700; color:#e6edf6; font-variant-numeric:tabular-nums;}
.cstat span{font-size:9.5px; color:var(--dim,#66727f); white-space:nowrap;}
.cstat.zero b{color:#78838f; font-weight:600;}
.ccard.open .cnum{color:#ff8a93;}
</style>

<body>
<!-- v22 -->
<header class="topbar">
  <div class="brand">热点监控</div>
  <a id="xbtn-heyi" class="xbtn" target="_blank" rel="noopener">@何一</a>
  <a id="xbtn-zb" class="xbtn" target="_blank" rel="noopener">@赵长鹏</a>
  <div class="spacer"></div>
  <div class="upd">更新于 <span id="upd-time">—</span></div>
  <button class="iconbtn" data-act="refresh" title="刷新">⟳</button>
</header>
<nav class="tabs">
  <button data-act="tab" data-tab="all" class="active">全部</button>
  <button data-act="tab" data-tab="hot">热搜</button>
  <button data-act="tab" data-tab="trench">战壕</button>
  <button data-act="tab" data-tab="summary">📝 当日总结</button>
</nav>
<main>
  <section id="tab-all" class="tabpane"></section>
  <section id="tab-hot" class="tabpane" hidden></section>
  <section id="tab-trench" class="tabpane" hidden></section>
  <section id="tab-summary" class="tabpane" hidden></section>
</main>
<script>
'use strict';
/* ============ constants ============ */
var PEOPLE=[
  {key:'heyi', name:'何一', color:'#ff6b81'},
  {key:'cz',   name:'赵长鹏', color:'#F0B90B'},
  {key:'elon', name:'马斯克', color:'#58a6ff'}
];
var KIND_NAME={original:'原创', retweet:'转推', quote:'引用', reply:'回复', follow:'新增关注', unfollow:'取关'};
var DEBOT_SLUG={sol:'solana', bsc:'bsc', robinhood:'robinhood'};
var CHAIN_ORDER=['BSC','Solana','Robinhood','OKX','Base','Arc','Ethereum'];
var CHAIN_COLOR={BSC:'#F0B90B', Solana:'#A371FF', Robinhood:'#00C805'};
var DY_LABEL={1:'新',3:'热',5:'首发',8:'独家',9:'挑战',16:'辟谣'};
var BIN_TYPE={listing:'上市', delisting:'下架', alpha:'Alpha'};
var LIQ_LABEL={volume:'交易量',buy_volume:'买入量',sell_volume:'卖出量',wallet_count:'钱包数',token_count:'代币数',token_created_count:'新建代币',token_migrated_count:'迁移代币',tx_count:'交易笔数',volume_change_pct:'量变幅(%)',avg_buy_per_wallet:'户均买入'};
var XXAPI_WB='https://v2.xxapi.cn/api/weibohot';
var XXAPI_DY='https://v2.xxapi.cn/api/douyinhot';
/* Data lives on the "data" branch; raw.githubusercontent.com serves it
   immediately after push (no Pages rebuild wait) with CORS *. */
var DATA_BASE='https://raw.githubusercontent.com/wnsdtk/hotspot/data/data/';
var WORKER='https://snowy-mud-3037.rj982946925.workers.dev';
var WORKER_POLL_MS=30000; // 30 seconds
var DATA_FILES=[
  ['tweets','tweets.json'],['bsc','trench-bsc.json'],['sol','trench-sol.json'],
  ['rb','trench-rb.json'],
  ['douyin','douyin.json'],['tags','tags-halfhour.json'],['daily','summary-daily.json'],
  ['binance','binance.json']
];
function dataUrl(f){return DATA_BASE+f+'?t='+Date.now();}
var POLL_MS=15000;
/* ============ state ============ */
var S={data:{}, wb:null, dy:null, prevHotlist:null, hotlistRows:null, douyinOk:false, lastUpdate:{}};
var UI={tab:'all', filter:'all', expanded:{liq:true}, liq:{chain:'bsc', iv:'24h'}, dyN:10, wbN:10, dailyPerson:null, days:{}};
/* ============ helpers ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nl2br(s){return s.replace(/\n/g,'<br>');}
/* v16: update frequency + last update time for every section */
function fmtTime(ts){if(!ts)return '--:--:--';var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);}
function updInfo(key,freq){var ts=S.lastUpdate[key];return '<span class="upd-info" style="font-weight:400;font-size:11px;color:var(--muted);margin-left:8px">'+esc(freq)+' · 上次 '+fmtTime(ts)+'</span>';}
function markUpd(key){S.lastUpdate[key]=Date.now();}
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s;}
function trim1(x){return String(Math.round(x*10)/10);}
function fmtMoney(v){
  if(v==null||v===''||isNaN(Number(v))) return '—';
  var n=Number(v), an=Math.abs(n), sign=n<0?'-':'';
  if(an>=10000) return sign+'$'+trim1(an/10000)+'万';
  if(an>=1000) return sign+'$'+Math.round(an).toLocaleString('en-US');
  return sign+'$'+Math.round(an);
}
function fmtHot(v){var n=Number(v);if(isNaN(n))return '';if(n>=10000)return trim1(n/10000)+'万';return String(Math.round(n));}
function fmtVal(v){
  if(typeof v==='number'){var an=Math.abs(v);return an>=10000?fmtMoney(v):v.toLocaleString('en-US');}
  return esc(v);
}
function relTime(iso){
  var t=Date.parse(iso);if(isNaN(t))return '';
  var s=Math.max(0,Math.floor((Date.now()-t)/1000));
  if(s<60)return '刚刚';
  var m=Math.floor(s/60);if(m<60)return m+'分钟前';
  var h=Math.floor(m/60);if(h<24)return h+'小时前';
  return Math.floor(h/24)+'天前';
}
function bjDate(d){d=d instanceof Date?d:new Date(d);if(isNaN(d))return '';
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function todayBj(){return bjDate(new Date());}
function fmtBj(iso){var d=new Date(iso);if(isNaN(d))return '';
  return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d).replace(/\//g,'-');}
function yesterdayStr(){var d=new Date();d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function personByKey(k){for(var i=0;i<PEOPLE.length;i++)if(PEOPLE[i].key===k)return PEOPLE[i];return {key:k,name:k};}
function kindBadge(kind){var n=KIND_NAME[kind]||kind;return '<span class="kbadge">'+esc(n)+'</span>';}
function debotUrl(chain,ca){var slug=DEBOT_SLUG[String(chain||'').toLowerCase()]||String(chain||'').toLowerCase();return 'https://debot.ai/token/'+slug+'/'+(ca||'');}
function xSearch(q){return 'https://x.com/search?q='+encodeURIComponent(q)+'&f=top';}
function douyinSearch(w){return 'https://www.douyin.com/search/'+encodeURIComponent(w)+'?type=general';}
function weiboSearch(t){return 'https://s.weibo.com/weibo?q='+encodeURIComponent(t);}
/* ============ v22 · DeBot 式公链流动性 ============ */
var LIQ_CHAIN={
  bsc:{name:'BSC', color:'#F0B90B', g:'B'},
  eth:{name:'Ethereum', color:'#627EEA', g:'Ξ'},
  solana:{name:'Solana', color:'#A371FF', g:'S'},
  base:{name:'Base', color:'#0052FF', g:'B'},
  arc:{name:'Arc', color:'#7C5CFF', g:'A'},
  robinhood:{name:'Robinhood', color:'#00C805', g:'R'},
  arbitrum:{name:'Arbitrum', color:'#28A0F0', g:'A'},
  monad:{name:'Monad', color:'#836EF9', g:'M'},
  hyperevm:{name:'HyperEVM', color:'#97FCE4', g:'H'},
  stable:{name:'Stable', color:'#00D1B2', g:'S'},
  xlayer:{name:'X Layer', color:'#C3CBD8', g:'X'},
  pharos:{name:'Pharos', color:'#FF6B6B', g:'P'}
};
var LIQ_ORDER=['bsc','solana','robinhood','xlayer','arc'];
var LIQ_IVS=[{k:'1h',t:'1H'},{k:'6h',t:'6H'},{k:'24h',t:'24H'}];
var PAD_NAME={flap:'Flap', four_meme:'Four', gangfun:'Gang.fun', pumpfun:'pump.fun', believe:'Believe',
  bonk:'BONK', meteora:'Meteora', raydium:'Raydium', virtuals:'Virtuals', clanker:'Clanker',
  bags:'Bags', moonshot:'Moonshot', pump:'pump.fun'};
var PAD_COLOR={flap:'#F5A623', four_meme:'#00C805', gangfun:'#F0B90B', pumpfun:'#14F195',
  believe:'#8B5CF6', bonk:'#F7931A', meteora:'#E8B44A', raydium:'#5D5FEF', virtuals:'#00D1B2',
  clanker:'#FF6B6B', bags:'#4EA1FF', moonshot:'#FF8FB1'};
var LIQ={cache:{}, loading:{}};
var LIQ_TTL=60000;

function compactNum(a){
  a=Math.abs(Number(a)||0);
  if(a>=1e9)return (a/1e9).toFixed(1)+'B';
  if(a>=1e6)return (a/1e6).toFixed(1)+'M';
  if(a>=1e3)return (a/1e3).toFixed(1)+'K';
  return String(Math.round(a));
}
function fmtUsd(v){
  if(v==null||v===''||isNaN(Number(v)))return '—';
  var n=Number(v);
  return (n<0?'-$':'$')+compactNum(n);
}
function fmtSignedUsd(v){
  if(v==null||isNaN(Number(v)))return '—';
  var n=Number(v);
  return (n>=0?'+':'-')+'$'+compactNum(n);
}
function fmtAvgUsd(v){
  if(v==null||isNaN(Number(v)))return '—';
  var n=Number(v), a=Math.abs(n);
  if(a>=1000)return (n<0?'-$':'$')+compactNum(a);
  return (n<0?'-$':'$')+Math.floor(a);
}
function fmtCnt(v){
  if(v==null||v===''||isNaN(Number(v)))return '—';
  return compactNum(v);
}
function pctChange(cur,prev){
  var c=Number(cur)||0, p=Number(prev)||0;
  if(p<=0)return null;
  return (c-p)/p*100;
}
function pctTag(v){
  if(v==null||isNaN(v))return '';
  var n=Math.round(v*10)/10, up=n>=-0.05;
  var txt=(n>0?'+':'')+Math.round(n)+'%';
  return '<span class="pct '+(up?'up':'dn')+'">'+(up?'↗ ':'↘ ')+txt+'</span>';
}
function padName(s){
  s=String(s||'');
  if(PAD_NAME[s])return PAD_NAME[s];
  return s.replace(/[_-]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
}
function padColor(s){
  if(PAD_COLOR[s])return PAD_COLOR[s];
  var h=0; for(var i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))%360;
  return 'hsl('+h+',58%,62%)';
}
function liqChainMeta(k){
  return LIQ_CHAIN[k]||{name:String(k||'').toUpperCase(), color:'#8d9aac', g:String(k||'?').charAt(0).toUpperCase()};
}
function chainName(k){
  var m=LIQ_CHAIN[String(k||'').toLowerCase()];
  if(m)return m.name;
  return String(k||'').replace(/^./,function(c){return c.toUpperCase();});
}
function normalizeLiq(d){
  var arr=((d&&d.data)||{}).chains||[];
  return arr.map(function(ch){
    return {
      key:String(ch.chain||''),
      summary:ch.summary||{},
      prev:ch.prev_summary||{},
      lps:(ch.top_launchpads||[]).slice(0,3).map(function(lp){
        return {name:lp.launchpad, stats:lp.stats||{}, prev:lp.prev_stats||{}};
      })
    };
  }).filter(function(c){return c.key;});
}
function fetchLiq(iv,force){
  iv=iv||'1h';
  var c=LIQ.cache[iv];
  if(!force&&c&&Date.now()-c.ts<LIQ_TTL)return Promise.resolve(c);
  if(LIQ.loading[iv])return LIQ.loading[iv];
  var url=workerUrl('https://debot.ai/api/edge/launchpad/stats/latest?interval='+iv);
  LIQ.loading[iv]=fetch(url,{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(d){
      if(!d||d.code!==0)throw new Error('code');
      var o={ts:Date.now(), chains:normalizeLiq(d)};
      if(!o.chains.length)throw new Error('empty');
      LIQ.cache[iv]=o;
      markUpd('liquidity');
      return o;
    })
    .catch(function(){return LIQ.cache[iv]||null;})
    .then(function(o){delete LIQ.loading[iv];return o;});
  return LIQ.loading[iv];
}
function liqChain(cur){
  var list=(LIQ.cache[UI.liq.iv]&&LIQ.cache[UI.liq.iv].chains)||[];
  for(var i=0;i<list.length;i++)if(list[i].key===cur)return list[i];
  return list[0]||null;
}
function liqTop(cur){
  var m=liqChainMeta(cur.key);
  return '<div class="liq-top"><span class="cicon" style="--c:'+m.color+'">'+esc(m.g)+'</span>'
    +'<span class="liq-t">'+esc(m.name)+' 实时指标</span>'
    +'<span class="qi" title="DeBot 链上聚合统计；百分比为当前周期对比上一周期">?</span>'
    +'<a class="liq-more" href="https://debot.ai/" target="_blank" rel="noopener">查看更多 ›</a></div>';
}
function liqTools(){
  var chains=(LIQ.cache[UI.liq.iv]&&LIQ.cache[UI.liq.iv].chains)||[];
  var present={}; chains.forEach(function(c){present[c.key]=1;});
  var order=LIQ_ORDER.filter(function(k){return present[k];})
    .concat(chains.map(function(c){return c.key;}).filter(function(k){return LIQ_ORDER.indexOf(k)<0;}));
  order=order.filter(function(k){return LIQ_ORDER.indexOf(k)>=0;});
  var icons=order.map(function(k){
    var m=liqChainMeta(k);
    return '<button class="ci'+(k===UI.liq.chain?' on':'')+'" data-act="liq-chain" data-c="'+esc(k)+'" title="'+esc(m.name)+'" aria-label="'+esc(m.name)+'">'
      +'<span class="g" style="--c:'+m.color+'">'+esc(m.g)+'</span></button>';
  }).join('');
  var segs=LIQ_IVS.map(function(x){
    return '<button data-act="liq-iv" data-iv="'+x.k+'" class="'+(UI.liq.iv===x.k?'on':'')+'">'+x.t+'</button>';
  }).join('');
  return '<div class="liq-tools"><div class="cicorow">'+icons+'</div><div class="segs">'+segs+'</div></div>';
}
function liqLps(cur){
  if(!cur.lps||!cur.lps.length)return '';
  return '<div class="lps">'+cur.lps.map(function(lp){
    var v=(lp.stats||{}).volume, pv=(lp.prev||{}).volume;
    var nm=padName(lp.name);
    return '<div class="lp"><div class="lp-h"><span class="lp-ico" style="--c:'+padColor(lp.name)+'">'
      +esc(nm.charAt(0))+'</span>'+esc(nm)+'</div>'
      +'<div class="lp-v">'+fmtUsd(v)+'</div><div class="lp-p">'+pctTag(pctChange(v,pv))+'</div></div>';
  }).join('')+'</div>';
}
function liqFlow(cur){
  var s=cur.summary||{};
  var buy=Number(s.buy_volume)||0, sell=Number(s.sell_volume)||0;
  var net=buy-sell, tot=buy+sell;
  var bp=tot>0?(buy/tot*100):50;
  return '<div class="flow"><div class="flow-lbls">'
    +'<span>买入量 <b>'+fmtUsd(buy)+'</b></span>'
    +'<span class="net '+(net>=0?'pos':'neg')+'">净流入 '+fmtSignedUsd(net)+'</span>'
    +'<span>卖出量 <b>'+fmtUsd(sell)+'</b></span></div>'
    +'<div class="flowbar"><i class="buy" style="width:'+bp.toFixed(1)+'%"></i>'
    +'<i class="sell" style="width:'+(100-bp).toFixed(1)+'%"></i></div></div>';
}
function liqMetrics(cur){
  var s=cur.summary||{}, p=cur.prev||{};
  var wc=Number(s.wallet_count)||0, bw=Number(s.buy_volume)||0;
  var pwc=Number(p.wallet_count)||0, pbw=Number(p.buy_volume)||0;
  var avg=wc>0?bw/wc:null, pavg=pwc>0?pbw/pwc:null;
  var cells=[
    ['交易额', fmtUsd(s.volume), pctChange(s.volume,p.volume)],
    ['钱包平均买入量', fmtAvgUsd(avg), (avg&&pavg)?pctChange(avg,pavg):null],
    ['活跃代币数', fmtCnt(s.token_count), pctChange(s.token_count,p.token_count)],
    ['活跃钱包数', fmtCnt(s.wallet_count), pctChange(s.wallet_count,p.wallet_count)],
    ['创建代币数', fmtCnt(s.token_created_count), pctChange(s.token_created_count,p.token_created_count)],
    ['迁移代币数', fmtCnt(s.token_migrated_count), pctChange(s.token_migrated_count,p.token_migrated_count)]
  ];
  return '<div class="mgrid">'+cells.map(function(c){
    return '<div class="mcell"><div class="mk">'+c[0]+'</div><div class="mv">'+c[1]+pctTag(c[2])+'</div></div>';
  }).join('')+'</div>';
}
function htmlLiquidity(){
  var open=!!UI.expanded.liq;
  var h='<div class="card liq"><div class="sect tog" data-act="toggle" data-key="liq">💧 公链流动性'
    +updInfo('liquidity','每5分钟更新')+' <span class="chev">'+(open?'▲':'▼')+'</span></div>';
  if(!open)return h+'</div>';
  var d=LIQ.cache[UI.liq.iv];
  if(!d){h+='<div class="empty">指标加载中…</div>';return h+'</div>';}
  var cur=liqChain(UI.liq.chain);
  if(!cur){h+='<div class="empty">暂无数据</div>';return h+'</div>';}
  h+=liqTop(cur)+liqTools()+liqLps(cur)+liqFlow(cur)+liqMetrics(cur);
  return h+'</div>';
}

/* ============ v22 · 今日链上热度总结 ============ */
function fmtHM(iso){
  var d=new Date(iso);
  if(isNaN(d))return '';
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function dailyPeriod(p,label,range,emoji){
  var themes=(p&&p.themes)||[], coins=(p&&p.coins)||[];
  var head='<div class="dph">'+emoji+' '+label+' <span>'+range+'</span></div>';
  if(!themes.length&&!coins.length)
    return '<div class="dperiod">'+head+'<div class="empty" style="padding:8px;font-size:12px">该时段数据不足</div></div>';
  var chips=themes.map(function(t){return '<span class="dchip">'+esc(t.text)+'</span>';}).join('');
  var rows=coins.map(function(c){
    return '<a class="dcoin" href="'+esc(debotUrl(c.chain,c.ca))+'"><b>$'+esc(c.symbol)+'</b>'
      +'<span>'+esc(chainName(c.chain))+'</span><span class="dhit">出现 '+esc(c.hits)+' 次</span></a>';
  }).join('');
  return '<div class="dperiod">'+head
    +(chips?'<div class="dchips">'+chips+'</div>':'')
    +(rows?'<div class="dcoins">'+rows+'</div>':'')+'</div>';
}
function htmlDaily(){
  var dd=S.data.daily;
  if(dd&&dd.generated_at){
    var gt=Date.parse(dd.generated_at);
    if(!isNaN(gt))S.lastUpdate.daily=gt;
  }
  var h='<div class="card"><div class="sect">📋 今日链上热度总结'+updInfo('daily','每天 12:00 / 22:00 更新')+'</div>';
  if(!dd||!dd.periods){
    h+='<div class="empty">中午 12:00 出上午段，晚上 22:00 出下午段</div>';
    return h+'</div>';
  }
  h+='<div class="dmeta">'+esc(dd.date||'')+' · 战壕全天叙事 · 生成于 '+esc(fmtHM(dd.generated_at))+'</div>';
  h+=dailyPeriod(dd.periods.morning,'上午','00:00 – 12:00','🌅');
  h+=dailyPeriod(dd.periods.evening||dd.periods.afternoon,'下午 / 晚上','12:00 – 22:00','🌆');
  var hist=dd.history||{};
  var days=Object.keys(hist).filter(function(d){return d!==dd.date;}).sort().reverse().slice(0,5);
  if(days.length){
    h+='<div class="subhead">最近几天</div>';
    h+=days.map(function(d){
      var e=hist[d]||{};
      var m=((e.morning||[])[0]||{}).text||'—';
      var a=((e.evening||e.afternoon||[])[0]||{}).text||'—';
      return '<div class="dhist"><span class="dhd">'+esc(String(d).slice(5))+'</span>'
        +'<span class="dhv">上午 '+esc(m)+'</span><span class="dhv">下午 '+esc(a)+'</span></div>';
    }).join('');
  }
  return h+'</div>';
}
/* ============ fetch ============ */
function fetchJson(url){
  return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .catch(function(){return null;});
}
function freshestStamp(){
  var best=null,bt=0;
  DATA_FILES.forEach(function(j){
    var d=S.data[j[0]];if(!d)return;
    ['updated_at','generated_at'].forEach(function(k){
      if(d[k]){var t=Date.parse(d[k]);if(!isNaN(t)&&t>bt){bt=t;best=d[k];}}
    });
  });
  return best;
}
/* ============ 全部：聪明钱异动 (NEW) ============ */
function htmlSmartMoves(){
  var nowMs=Date.now();
  function ageOf(t){
    var ts=Number(t.creation_timestamp)||0;
    if(ts>0)return Math.floor((nowMs-ts*1000)/60000);
    return ageMin(t);
  }
  var CH=[['bsc','BSC','#F0B90B'],['sol','Solana','#A371FF'],['rb','Robinhood','#00C805']];
  var groups=[], total=0;
  CH.forEach(function(c){
    var d=S.data[c[0]];
    var toks=((d&&d.tokens)||[]).filter(function(t){return ageOf(t)<=5*1440;})
      .sort(function(a,b){
        return (Number(b.smart_count)||0)-(Number(a.smart_count)||0)
          || (Number(b.vol_1h)||0)-(Number(a.vol_1h)||0);
      }).slice(0,5);
    total+=toks.length;
    groups.push('<div class="subhead" style="color:'+c[2]+'">'+c[1]+' · '+toks.length+' 个 · 5 天内</div>'
      +(toks.length?toks.map(function(t){return coinCard(t,false,c[2]);}).join('')
                   :'<div class="empty">暂无数据</div>'));

    if(!(t.word in pm))fresh.push(t);

  m=s.match(/(\d+)\s*小时前/);if(m)return +m[1]*60;

}

function buildLocalTags(){
  // Generate narrative tags from trench data (gmgn-style, at least 5)
  var tags=[];
  var allToks=[];
  ['bsc','sol','rb'].forEach(function(k){
    var d=S.data[k];
    if(d&&Array.isArray(d.tokens))d.tokens.forEach(function(t){t._chain=k;allToks.push(t);});
  });
  if(!allToks.length)return tags;
  // Group by narrative
  var byNarr={};
  allToks.forEach(function(t){
    var n=t.narrative||'';
    if(n){if(!byNarr[n])byNarr[n]=[];byNarr[n].push(t);}
  });
  Object.keys(byNarr).forEach(function(n){
    if(byNarr[n].length>=2){
      var top=byNarr[n].sort(function(a,b){return (b.smart_count||0)-(a.smart_count||0);})[0];
      tags.push({text:'#'+n+'持续发酵', coin_symbol:'$'+(top.symbol||''), coin_ca:top.ca, coin_chain:top.chain});
    }
  });
  // New coin surge
  var newCoins=allToks.filter(function(t){
    var cts=Number(t.creation_timestamp)||0;
    return cts>0&&(Date.now()-cts*1000)<2*3600*1000;
  });
  if(newCoins.length>=3)tags.push({text:'#新币发行加速'});
  // BSC density
  var bscNew=allToks.filter(function(t){
    var cts=Number(t.creation_timestamp)||0;
    return t._chain==='bsc'&&cts>0&&(Date.now()-cts*1000)<2*3600*1000;
  });
  if(bscNew.length>=2)tags.push({text:'#BSC链新币最密集'});
  // Smart money pile
  var smartPile=allToks.filter(function(t){return (Number(t.smart_count)||0)>=10;});
  if(smartPile.length>=2){
    var tp=smartPile.sort(function(a,b){return (b.smart_count||0)-(a.smart_count||0);})[0];
    tags.push({text:'#聪明钱扎堆', coin_symbol:'$'+(tp.symbol||''), coin_ca:tp.ca, coin_chain:tp.chain});
  }
  // FIX v11: ensure at least 5 tags with fallbacks
  var fallbacks=['#市场情绪回暖','#链上活跃度上升','#新资金入场','#Meme季持续','#聪明钱调仓','#BSC生态活跃','#Solana新币不断'];
  var seen2={};tags.forEach(function(t){seen2[t.text]=1;});
  for(var fi=0;fi<fallbacks.length&&tags.length<5;fi++){
    if(!seen2[fallbacks[fi]]){seen2[fallbacks[fi]]=1;tags.push({text:fallbacks[fi]});}
  }
  // If still <5, add chain activity tags
  var chainNames={bsc:'BSC',sol:'Solana',rb:'Robinhood'};
  ['bsc','sol','rb'].forEach(function(k){
    if(tags.length>=5)return;
    var d=S.data[k];
    var n=(d&&Array.isArray(d.tokens))?d.tokens.length:0;
    if(n>0){
      var txt='#'+(chainNames[k]||k)+'战壕'+n+'个标的';
      if(!seen2[txt]){seen2[txt]=1;tags.push({text:txt});}
    }
  });
  return tags.slice(0,8);
}

function htmlChain(key,title,color){
  var d=S.data[key];
  var toks=(d&&Array.isArray(d.tokens))?d.tokens:[];
  function mcOf(t){return Number(t.market_cap)||0;}
  function heatOf(t){
    // 热度 = 1h 成交量为主，KOL/聪明钱数量加权
    var v=Number(t.vol_1h)||0;
    var k=Number(t.smart_count)||0;
    if(k>60)k=60;
    return v*(1+k/20);
  }
  var byCa=function(t){return t.ca||t.address||'';};
  // 上线分钟数：优先用 creation_timestamp，age_text 缺失时也能算
  var ageOf=function(t){
    var ts=Number(t.creation_timestamp)||0;
    if(ts>0)return Math.floor((Date.now()-ts*1000)/60000);
    return ageMin(t);
  };

  // 前 5：5 小时内上线的新币，先按热度挑 5 个，再按市值从低到高排列
  var fresh=toks.filter(function(t){return ageOf(t)<=300;})
    .sort(function(a,b){return (heatOf(b)-heatOf(a))||(mcOf(a)-mcOf(b));})
    .slice(0,5);
  fresh.sort(function(a,b){return mcOf(a)-mcOf(b);});

  var used={};
  fresh.forEach(function(t){used[byCa(t)]=1;});

  // 后 3：5 天内的热门（排除 5 小时内与已出现的），不足 8 个时自动补齐
  var hotNeed=Math.max(3,8-fresh.length);
  var hot=toks.filter(function(t){
    var a=ageOf(t);
    return a>300 && a<=5*1440 && !used[byCa(t)];
  }).sort(function(a,b){return heatOf(b)-heatOf(a);}).slice(0,hotNeed);

  hot.forEach(function(t){used[byCa(t)]=1;});
  // 兜底：该链新币太少时（如 Robinhood），用其余币按热度补满 8 个
  var short=8-fresh.length-hot.length;
  if(short>0){
    var more=toks.filter(function(t){return !used[byCa(t)];})
      .sort(function(a,b){return heatOf(b)-heatOf(a);}).slice(0,short);
    hot=hot.concat(more);
  }

  var cards='';
  if(!toks.length)cards='<div class="empty">暂无数据</div>';
  else{
    if(fresh.length){
      cards+='<div class="subhead" style="color:var(--green)">🆕 5 小时内新币 · 市值低 → 高</div>'
        +fresh.map(function(t){return coinCard(t,false,color);}).join('');
    }
    if(hot.length){
      cards+='<div class="subhead" style="color:var(--orange)">🔥 5 天内热门</div>'
        +hot.map(function(t){return coinCard(t,false,color);}).join('');
    }
    if(!fresh.length&&!hot.length)cards='<div class="empty">暂无数据</div>';
  }
  var meta=toks.length+' 个币'+((d&&d.source)?' · 数据源 '+esc(d.source):'');
  return '<div class="card"><div class="sect" style="color:'+color+'">'+esc(title)+updInfo('trench','每30秒更新')+' <span class="muted small" style="color:var(--muted);font-weight:400">'+meta+'</span></div>'
    +'<div class="coinlist" style="background:'+color+'33">'+cards+'</div></div>';
}

/* ============ surgical section updates ============
   Each section has a stable container id. On every poll we compute a
   signature from the section's data slice + relevant UI state (timestamps
   excluded). Only sections whose signature changed get their innerHTML
   replaced — never a full-page rewrite. Scroll position is preserved and
   expanded/collapsed states survive because they live in UI, not in DOM. */
function sigData(d){
  if(!d||typeof d!=='object')return String(d);
  var c={};
  for(var k in d)if(Object.prototype.hasOwnProperty.call(d,k)&&k!=='updated_at'&&k!=='generated_at')c[k]=d[k];
  return JSON.stringify(c);
}

/* ============ v9: Worker-based real-time polling (10s for tweets/trench) ============ */
function workerUrl(u){return WORKER+'/?u='+encodeURIComponent(u);}
/* ============ v23 · TG 实时解析修复 ============
   原实现用 innerText 取文本，但 DOMParser 文档里 <br> 不会变成换行，
   整个推文被压成 1 行，随后被 lines.length<3 的过滤全部丢弃 → 实时抓取恒为 0 条。
   这里把 <br> 显式换成 \n，并按 TG 模板拆出「原文 / 中文翻译 / 类型 / 原帖链接」。 */
function tgMsgText(el){
  if(!el)return '';
  var c=el.cloneNode(true);
  var brs=c.querySelectorAll('br');
  for(var i=brs.length-1;i>=0;i--){
    var b=brs[i];
    if(b.parentNode)b.parentNode.replaceChild(document.createTextNode('\n'),b);
  }
  return String(c.textContent||'').replace(/\u00a0/g,' ').replace(/\r/g,'');
}
function tgIsNoise(s){
  if(!s)return true;
  if(/^(\u{1F4CC}|\u{1F4AC}|\u{1F504}|\u{1F464}|\u2705|\u274C|\u{1F5D1}|\u{1F4DD}|\u{1F552}|\u{1F517}|——)/u.test(s))return true;
  if(s.indexOf('粉丝')>=0&&s.length<70)return true;
  if(s.indexOf('查看原文')>=0)return true;
  if(/^推文时间/.test(s))return true;
  return false;
}

function tgBgUrl(el){
  if(!el)return '';
  var st=el.getAttribute('style')||'';
  var m=st.match(/background-image\s*:\s*url\(['"]?([^'")]+)['"]?\)/i);
  return m?m[1]:'';
}
/* 从一条 TG 消息里提取图片/视频（引用推文的图片是 link preview 的背景图） */
function tgMsgMedia(msg){
  var media=[], seen={};
  function add(u,type){
    if(!u)return;
    u=String(u).trim();
    if(u.indexOf('//')===0)u='https:'+u;
    if(u.indexOf('http')!==0)return;
    if(seen[u])return;
    seen[u]=1;
    if(media.length<4)media.push({url:u,type:type||'img'});
  }
  try{
    msg.querySelectorAll('a.tgme_widget_message_link_preview').forEach(function(a){
      add(tgBgUrl(a.querySelector('i.link_preview_image')),'img');
      var v=a.querySelector('i.link_preview_video, video');
      if(v)add(tgBgUrl(v)||v.getAttribute('src')||'','video');
    });
    msg.querySelectorAll('a.tgme_widget_message_photo_wrap, div.tgme_widget_message_photo').forEach(function(d){
      add(tgBgUrl(d),'img');
    });
    msg.querySelectorAll('video').forEach(function(v){
      var s=v.querySelector('source');
      var src=(s&&s.getAttribute('src'))||v.getAttribute('src')||'';
      if(src)add(src,'video');
      else add(v.getAttribute('poster')||'','img');
    });
    msg.querySelectorAll('img').forEach(function(img){
      var src=img.getAttribute('src')||'';
      if(!src||src.indexOf('data:')===0)return;
      var cls=(img.getAttribute('class')||'')+' '+((img.parentNode&&img.parentNode.getAttribute)?(img.parentNode.getAttribute('class')||''):'');
      if(/user_photo|avatar|emoji/i.test(cls))return;
      add(src,'img');
    });
  }catch(e){}
  return media;
}

function sortTweets(arr){
  return arr.sort(function(a,b){return (Date.parse(b.time)||0)-(Date.parse(a.time)||0);});
}
function mergeTweets(base, extra){
  var map={}, order=[];
  function key(t){return t.id||t.url||((t.person||'')+'|'+t.time);}
  (base||[]).forEach(function(t){
    var k=key(t);if(!k)return;
    if(!map[k]){map[k]=t;order.push(k);}
  });
  (extra||[]).forEach(function(t){
    var k=key(t);if(!k)return;
    if(!map[k]){map[k]=t;order.push(k);return;}
    var a=map[k];
    if((!a.media||!a.media.length)&&t.media&&t.media.length)a.media=t.media;
    if(!a.text_zh&&t.text_zh)a.text_zh=t.text_zh;
  });
  return sortTweets(order.map(function(k){return map[k];})).slice(0,80);
}
function parseWorkerTweets(html, channel, defaultPerson){
  var tweets=[];
  try{
    var doc=new DOMParser().parseFromString(html,'text/html');
    var msgs=doc.querySelectorAll('div.tgme_widget_message_wrap');
    msgs.forEach(function(msg){
      try{
        var t=msg.querySelector('div.tgme_widget_message_text');
        if(!t)return;
        var lines=tgMsgText(t).split('\n').map(function(s){return s.trim();}).filter(function(s){return s;});
        if(!lines.length)return;
        var head=lines[0]||'';
        if(head.indexOf('删除')>=0)return;            // 已删除的推文不展示
        // 作者：TG 模板里的「👤 昵称 @handle · x 粉丝」行最可靠
        var who='';
        for(var i=0;i<lines.length;i++){if(lines[i].indexOf('\u{1F464}')===0){who=lines[i];break;}}
        var wl=(who+' '+lines.join(' ')).toLowerCase();
        var person=defaultPerson;
        if(wl.indexOf('heyibinance')>=0||wl.indexOf('yi he')>=0||wl.indexOf('何一')>=0)person='heyi';
        else if(wl.indexOf('cz_binance')>=0||wl.indexOf('赵长鹏')>=0)person='cz';
        else if(wl.indexOf('elonmusk')>=0||wl.indexOf('马斯克')>=0)person='elon';
        var handle=person==='heyi'?'@heyibinance':(person==='cz'?'@cz_binance':'@elonmusk');
        // 类型
        var kind='original';
        if(head.indexOf('引用')>=0)kind='quote';
        else if(head.indexOf('回复')>=0)kind='reply';
        else if(head.indexOf('转推')>=0)kind='retweet';
        else if(head.indexOf('新增关注')>=0)kind='follow';
        else if(head.indexOf('取消关注')>=0)kind='unfollow';
        // 原帖链接
        var url='';
        var links=t.querySelectorAll('a');
        for(var j=0;j<links.length;j++){
          var href=links[j].getAttribute('href')||'';
          if(/\/status\/\d+/.test(href)){url=href;break;}
        }
        if(!url)return;
        var timeEl=msg.querySelector('time[datetime]');
        var time=timeEl?timeEl.getAttribute('datetime'):'';
        // 分段：中文翻译块 / 原推块 / 时间行
        var zhAt=-1, origAt=-1, timeAt=-1;
        for(var k=0;k<lines.length;k++){
          if(zhAt<0&&lines[k].indexOf('中文翻译')>=0)zhAt=k;
          if(origAt<0&&lines[k].indexOf('原推翻译')>=0)origAt=k;
          if(timeAt<0&&lines[k].indexOf('推文时间')>=0)timeAt=k;
        }
        var bodyEnd=timeAt>=0?timeAt:lines.length;
        var bodyStart=origAt>=0?origAt+1:(zhAt>=0?zhAt+1:0);
        var body=[],zh=[];
        for(var b=bodyStart;b<bodyEnd;b++){if(!tgIsNoise(lines[b]))body.push(lines[b]);}
        if(zhAt>=0){
          var zEnd=origAt>=0?origAt:bodyEnd;
          for(var z=zhAt+1;z<zEnd;z++){if(!tgIsNoise(lines[z]))zh.push(lines[z]);}
        }
        var text=body.join('\n').trim();
        var textZh=zh.join('\n').trim();
        if(!text&&!textZh)return;
        if(!text){text=textZh;textZh='';}
        var idMatch=url.match(/\/status\/(\d+)/);
        tweets.push({
          id:idMatch?idMatch[1]:url, person:person, handle:handle,
          time:time, text:text, text_zh:(textZh&&textZh!==text)?textZh:'',
          kind:kind, media:tgMsgMedia(msg), url:url
        });
      }catch(e){}
    });
  }catch(e){}
  return sortTweets(tweets).slice(0,60);
}
function fetchWorkerTweets(){
  var channels=[
    {ch:'TechMelonCzHeyi', person:'heyi'},
    {ch:'TechMelonElonMusk', person:'elon'}
  ];
  // heyi channel has both heyi and cz, we'll split by content later (simplified: assign by channel)
  var jobs=channels.map(function(cfg){
    return fetch(workerUrl('https://t.me/s/'+cfg.ch),{cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.text();})
      .then(function(html){return parseWorkerTweets(html,cfg.ch,cfg.person);})
      .catch(function(){return [];});
  });
  return Promise.all(jobs).then(function(results){
    var all=[];
    results.forEach(function(arr){all=all.concat(arr);});
    // Sort by time desc, dedupe by id
    var seen={}, uniq=[];
    all.forEach(function(t){if(!seen[t.id]){seen[t.id]=1;uniq.push(t);}});
    uniq.sort(function(a,b){return (b.time||'').localeCompare(a.time||'');});
    return {updated_at:new Date().toISOString(), tweets:uniq.slice(0,60)};
  });
}

function fetchWorkerTrench(chain){

      if(!rank.length)throw new Error('gmgn empty');
      var tokens=rank.map(function(t){return normGmgnToken(t,chain);});
      return {updated_at:new Date().toISOString(), tokens:tokens.slice(0,50), source:'gmgn'};
    })
    .catch(function(){
      return fetch(workerUrl(durl),{cache:'no-store'})
        .then(function(r){if(!r.ok)throw new Error('debot http '+r.status);return r.json();})
        .then(function(d){
          var arr=(d&&d.data)||[];
          var tokens=arr.map(function(t){return normDebotToken(t,chain);});
          return {updated_at:new Date().toISOString(), tokens:tokens.slice(0,50), source:'debot'};
        })
        .catch(function(){return null;});
    });
}
function pollWorkerFast(){
  // Tweets every 10s
  fetchWorkerTweets().then(function(d){
    if(d&&d.tweets&&d.tweets.length){
      var cur=(S.data.tweets&&S.data.tweets.tweets)||[];
      S.data.tweets={updated_at:new Date().toISOString(), tweets:mergeTweets(cur,d.tweets)};
      markUpd('tweets');
      updateSections();
      setUpdTime();
    }
  });
  // Trench every 10s (stagger slightly)
  ['bsc','sol','rb'].forEach(function(k,i){
    setTimeout(function(){
      fetchWorkerTrench(k).then(function(d){
        if(d&&d.tokens){
          S.data[k]=d;
          markUpd('trench');
          updateSections();
        }
      });
    }, i*1500);
  });
}
function setUpdTime(){
  var el=document.getElementById('upd-time');
  if(el){
    var d=new Date();
    var s=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
    el.textContent=s;
  }
}
function fetchWorkerDouyin(){
  return fetch(workerUrl('https://www.douyin.com/aweme/v1/web/hot/search/list/'),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
    .then(function(d){
      var wl=(d&&d.data&&d.data.word_list)||[];
      var tl=(d&&d.data&&d.data.trending_list)||[];
      var hotlist=wl.map(function(w){
        return {word:w.word||'', hot_value:w.hot_value||0, label:w.label||0};
      });
      var trending=tl.map(function(t){
        return {word:t.word||''};
      });
      return {updated_at:new Date().toISOString(), trending:trending, hotlist:hotlist, rising:[]};
    })
    .catch(function(){return null;});
}
function pollWorkerSlow(){
  if(document.hidden)return;
  // Douyin every 5 min via Worker
  fetchWorkerDouyin().then(function(d){
    if(d&&d.hotlist&&d.hotlist.length){
      S.data.douyin=d;
      S.douyinOk=true;
      markUpd('douyin');
      try{
        var prevSnap=JSON.parse(localStorage.getItem('dy_hotlist_snap')||'null');
        if(prevSnap&&Array.isArray(prevSnap)&&prevSnap.length){
          // FIX v15: if diff is empty, fall back to top-5 — never leave empty
          var _rows=diffHotlist(prevSnap,d.hotlist);
          S.hotlistRows=(_rows&&_rows.length)?_rows:topHotlistFallback(d.hotlist);
        }else{
          S.hotlistRows=topHotlistFallback(d.hotlist);
        }
        localStorage.setItem('dy_hotlist_snap',JSON.stringify(d.hotlist));
      }catch(e){
        S.hotlistRows=topHotlistFallback(d.hotlist);
      }
      updateSections();
    }
  });
  // 公链流动性仪表盘：跟随所选周期，每 5 分钟刷新
  fetchLiq(UI.liq.iv,true).then(function(){updateSections();});
  // v22: 热度总结改 30 分钟一次；上游 tags-halfhour.json 在 :00/:30 写入，
  // 这里只在上游超过 30 分钟未更新时用本地战壕数据兜底，不再每 5 分钟覆盖。
  try{
    var tu=S.data.tags&&S.data.tags.updated_at?Date.parse(S.data.tags.updated_at):0;
    if(!tu||Date.now()-tu>60*60*1000){
      var lt=buildLocalTags();
      if(lt&&lt.length){
        S.data.tags={updated_at:new Date().toISOString(),tags:lt};
        markUpd('tags');
        updateSections();
      }
    }
  }catch(e){}
}
/* ============ refresh / boot ============ */

function refresh(){
  var jobs=DATA_FILES.map(function(j){return fetchJson(dataUrl(j[1])).then(function(d){return [j[0],d];});});
  jobs.push(fetchJson(XXAPI_WB).then(function(d){return ['wb',d];}));
  jobs.push(fetchJson(XXAPI_DY).then(function(d){return ['dy',d];}));
  return Promise.all(jobs).then(function(results){
    var data={},wb=null,dy=null;
    results.forEach(function(r){
      if(r[0]==='wb')wb=r[1];else if(r[0]==='dy')dy=r[1];else data[r[0]]=r[1];
    });
    // FIX v13: Don't let stale GitHub JSON overwrite fresh Worker data
    // Worker manages: tweets, bsc, sol, rb, liquidity, douyin
    var WORKER_KEYS={tweets:1,bsc:1,sol:1,rb:1,douyin:1,tags:1};
    Object.keys(data).forEach(function(k){
      if(WORKER_KEYS[k]){
        // Only overwrite if Worker has no data yet AND GitHub has valid data
        var cur=S.data[k];
        var hasCur=cur&&(Array.isArray(cur.tokens)?cur.tokens.length:(Array.isArray(cur.tweets)?cur.tweets.length:(Array.isArray(cur.chains)?cur.chains.length:(Array.isArray(cur.hotlist)?cur.hotlist.length:0))));
        var hasNew=data[k]&&(Array.isArray(data[k].tokens)?data[k].tokens.length:(Array.isArray(data[k].tweets)?data[k].tweets.length:(Array.isArray(data[k].chains)?data[k].chains.length:(Array.isArray(data[k].hotlist)?data[k].hotlist.length:0))));
        if(!hasCur&&hasNew)S.data[k]=data[k];
      }else{
        S.data[k]=data[k];
      }
    });
    S.wb=wb;S.dy=dy;markUpd('wb');markUpd('dy');markUpd('binance');markUpd('daily');
    var dj=data.douyin;
    S.douyinOk=!!(dj&&Array.isArray(dj.hotlist));
    if(S.douyinOk){
      try{
        var prevSnap=JSON.parse(localStorage.getItem('dy_hotlist_snap')||'null');
        if(prevSnap&&Array.isArray(prevSnap)){
          // FIX v15: if diff is empty, fall back to top-5 — never leave empty
          var _brows=diffHotlist(prevSnap,dj.hotlist);
          S.hotlistRows=(_brows&&_brows.length)?_brows:topHotlistFallback(dj.hotlist);
        }else{
          S.hotlistRows=topHotlistFallback(dj.hotlist);
        }
        localStorage.setItem('dy_hotlist_snap',JSON.stringify(dj.hotlist));
      }catch(e){
        if(S.prevHotlist){
          var _crows=diffHotlist(S.prevHotlist,dj.hotlist);
          S.hotlistRows=(_crows&&_crows.length)?_crows:topHotlistFallback(dj.hotlist);
        }else{
          S.hotlistRows=topHotlistFallback(dj.hotlist);
        }
      }
      S.prevHotlist=dj.hotlist;
    }
    updateSections();
  });
}
function boot(){
  var y=yesterdayStr();
  var a=document.getElementById('xbtn-heyi');
  if(a)a.href='https://x.com/search?q=%40heyibinance%20since:'+y+'&f=top';
  var b=document.getElementById('xbtn-zb');
  if(b)b.href='https://x.com/search?q=%40cz_binance%20since:'+y+'&f=top';
  buildShell();
  updateSections();
  fetchLiq(UI.liq.iv,true).then(function(){updateSections();});
  refresh();
  setInterval(refresh,POLL_MS);
  // v9: Worker 10s polling for tweets/trench (real-time)
  setTimeout(pollWorkerFast, 3000); // first poll after 3s
  setInterval(pollWorkerFast, WORKER_POLL_MS);
  setTimeout(pollWorkerSlow, 8000);
  setInterval(pollWorkerSlow, 300000); // 5 min

}

  var el=e.target&&e.target.closest?e.target.closest('[data-act]'):null;

});
if(typeof globalThis.__TEST__==='undefined'){
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
  else boot();
}
